<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KLEEFOOD – Übergänge zur Auswahl</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800;900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
<style>
/* =======================================================================
   AUSWAHL-SEITE: 6 Übergänge für Screen 3 nebeneinander zum Anschauen.
   Jede Kachel spielt ihren Übergang in Schleife. Klick = sofort abspielen.
   ======================================================================= */
:root{--bg:#111417;--green:#00E676;--gold:#FF9F1C;--muted:rgba(255,255,255,.6);}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);color:#fff;font-family:'Poppins',system-ui,sans-serif;
  padding:40px 32px 60px;min-height:100vh;
}
h1{font-family:'Bebas Neue',sans-serif;font-size:54px;letter-spacing:4px;color:var(--green);}
.lead{color:var(--muted);margin-top:6px;font-size:16px;}

.grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:28px;margin-top:38px;max-width:1400px;
}
.card{background:#171c20;border:1.5px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;}
.card h2{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;}
.card h2 b{color:var(--gold);}
.card p{font-size:13.5px;color:var(--muted);margin:2px 0 12px;line-height:1.4;}

/* Mini-Screen im Hochformat (9:16) */
.screen{
  position:relative;width:100%;aspect-ratio:9/16;border-radius:12px;overflow:hidden;
  background:#000;cursor:pointer;
}
.layer{
  position:absolute;inset:0;background-size:cover;background-position:center;
}
.label{
  position:absolute;left:10px;right:10px;bottom:10px;z-index:6;
  font-family:'Montserrat',sans-serif;font-weight:900;font-size:13px;letter-spacing:1px;
  background:var(--gold);color:#0b0f11;padding:6px 10px;border-radius:8px;text-align:center;
}

/* ---------- 1 · Klee-Wipe (aktuell) ---------- */
.t1 .bar{
  position:absolute;inset:-10% -30%;z-index:5;display:grid;place-items:center;
  background:linear-gradient(135deg,#00E676,#10B981 45%,#FF9F1C);
  transform:translateX(-140%) skewX(-11deg);
  font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;color:#0b0f11;
}
.t1.go .bar{animation:t1 1.2s cubic-bezier(.65,0,.35,1);}
@keyframes t1{0%{transform:translateX(-140%) skewX(-11deg);}45%,58%{transform:translateX(0) skewX(-11deg);}100%{transform:translateX(140%) skewX(11deg);}}

/* ---------- 2 · Balken-Shutter ---------- */
.t2 .slat{position:absolute;top:0;bottom:0;width:20.4%;z-index:5;background:linear-gradient(180deg,#00E676,#10B981);transform:scaleY(0);transform-origin:top;}
.t2 .slat:nth-child(1){left:0;}   .t2 .slat:nth-child(2){left:20%;}
.t2 .slat:nth-child(3){left:40%;} .t2 .slat:nth-child(4){left:60%;}
.t2 .slat:nth-child(5){left:80%;}
.t2.go .slat{animation:t2 1.2s ease-in-out;}
.t2.go .slat:nth-child(2){animation-delay:.06s;} .t2.go .slat:nth-child(3){animation-delay:.12s;}
.t2.go .slat:nth-child(4){animation-delay:.18s;} .t2.go .slat:nth-child(5){animation-delay:.24s;}
@keyframes t2{0%{transform:scaleY(0);transform-origin:top;}40%,55%{transform:scaleY(1);transform-origin:top;}
              56%{transform:scaleY(1);transform-origin:bottom;}100%{transform:scaleY(0);transform-origin:bottom;}}

/* ---------- 3 · Zoom-Punch ---------- */
.t3.go .layer.a{animation:t3out 1.2s ease-in forwards;}
.t3.go .layer.b{animation:t3in  1.2s ease-out forwards;}
@keyframes t3out{0%{transform:scale(1);opacity:1;}45%{transform:scale(1.6);opacity:0;}100%{opacity:0;}}
@keyframes t3in {0%,40%{transform:scale(1.35);opacity:0;}100%{transform:scale(1);opacity:1;}}

/* ---------- 4 · Push-Up ---------- */
.t4.go .layer.a{animation:t4out 1.1s cubic-bezier(.65,0,.35,1) forwards;}
.t4.go .layer.b{animation:t4in  1.1s cubic-bezier(.65,0,.35,1) forwards;}
@keyframes t4out{to{transform:translateY(-100%);}}
@keyframes t4in {from{transform:translateY(100%);} to{transform:translateY(0);}}

/* ---------- 5 · Türen ---------- */
.t5 .door{position:absolute;top:0;bottom:0;width:50%;z-index:5;background-size:200% 100%;}
.t5 .door.l{left:0;background-position:left center;}
.t5 .door.r{right:0;background-position:right center;}
.t5.go .door.l{animation:t5l 1.2s cubic-bezier(.65,0,.35,1) forwards;}
.t5.go .door.r{animation:t5r 1.2s cubic-bezier(.65,0,.35,1) forwards;}
@keyframes t5l{0%,25%{transform:translateX(0);}100%{transform:translateX(-105%);}}
@keyframes t5r{0%,25%{transform:translateX(0);}100%{transform:translateX(105%);}}

/* ---------- 6 · Blitz-Cut ---------- */
.t6 .flash{position:absolute;inset:0;z-index:5;background:#fff;opacity:0;}
.t6.go .flash{animation:t6 .7s ease-out;}
@keyframes t6{0%{opacity:0;}30%{opacity:1;}100%{opacity:0;}}

.foot{margin-top:40px;color:var(--muted);font-size:15px;}
.foot b{color:#fff;}
</style>
</head>
<body>

<h1>ÜBERGÄNGE FÜR SCREEN 3</h1>
<p class="lead">Jede Kachel spielt ihren Übergang alle paar Sekunden. Klick auf eine Kachel = sofort abspielen.</p>

<div class="grid" id="grid"></div>

<p class="foot">Sag mir einfach die <b>Nummer</b>, die dir gefällt – dann baue ich sie in Screen 3 ein.
Alle sechs sind reines CSS: kein Video, kein Download, laufen flüssig auf dem Fire TV Stick.</p>

<script>
/* Zwei Beispielbilder für die Vorschau */
const IMG_A = "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=70";
const IMG_B = "https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?auto=format&fit=crop&w=600&q=70";

const TRANSITIONS = [
  {n:1, key:"t1", name:"Klee-Wipe",      desc:"Farbbalken in Grün/Gold fährt diagonal durch, Logo blitzt auf. (aktuell eingebaut)",
   extra:'<div class="bar">KLEEFOOD</div>'},
  {n:2, key:"t2", name:"Balken-Shutter", desc:"Fünf grüne Balken fahren nacheinander runter, decken zu, fahren weiter runter.",
   extra:'<div class="slat"></div><div class="slat"></div><div class="slat"></div><div class="slat"></div><div class="slat"></div>'},
  {n:3, key:"t3", name:"Zoom-Punch",     desc:"Gericht zoomt heran und verschwindet, das nächste zoomt zurück ins Bild.", extra:''},
  {n:4, key:"t4", name:"Push-Up",        desc:"Das nächste Gericht schiebt das aktuelle nach oben aus dem Bild.", extra:''},
  {n:5, key:"t5", name:"Türen",          desc:"Das Bild teilt sich in der Mitte und fährt wie zwei Türen auf.", extra:''},
  {n:6, key:"t6", name:"Blitz-Cut",      desc:"Kurzer heller Blitz, harter Schnitt – schnell und unaufgeregt.", extra:''}
];

const grid = document.getElementById('grid');

TRANSITIONS.forEach(t => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    '<h2><b>' + t.n + '</b> · ' + t.name + '</h2>' +
    '<p>' + t.desc + '</p>' +
    '<div class="screen ' + t.key + '">' +
      '<div class="layer b" style="background-image:url(' + IMG_B + ')"></div>' +
      '<div class="layer a" style="background-image:url(' + IMG_A + ')"></div>' +
      (t.key === 't5'
        ? '<div class="door l" style="background-image:url(' + IMG_A + ')"></div>' +
          '<div class="door r" style="background-image:url(' + IMG_A + ')"></div>'
        : '') +
      t.extra +
      '<div class="label">Übergang ' + t.n + '</div>' +
    '</div>';
  grid.appendChild(card);

  const scr = card.querySelector('.screen');
  const a = scr.querySelector('.layer.a'), b = scr.querySelector('.layer.b');
  const doors = [...scr.querySelectorAll('.door')];
  let flip = false;

  function run(){
    scr.classList.remove('go');
    void scr.offsetWidth;                  // Reflow -> Animation startet neu
    scr.classList.add('go');
    setTimeout(() => {                     // nach dem Übergang Bilder tauschen
      flip = !flip;
      const front = flip ? IMG_B : IMG_A, back = flip ? IMG_A : IMG_B;
      a.style.backgroundImage = 'url(' + front + ')';
      b.style.backgroundImage = 'url(' + back  + ')';
      doors.forEach(d => d.style.backgroundImage = 'url(' + front + ')');
      scr.classList.remove('go');
    }, 1250);
  }

  scr.onclick = run;
  setInterval(run, 3800 + t.n * 120);      // leicht versetzt, damit es lebendig wirkt
  setTimeout(run, 600 + t.n * 200);
});
</script>
</body>
</html>
