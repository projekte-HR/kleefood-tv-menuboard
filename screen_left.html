<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KLEEFOOD – Screen 1 – Burger & Pizza</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800;900&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
/* =======================================================================
   KLEEFOOD – SCREEN 1 (1920x1080)
   Alles gleichzeitig sichtbar, nichts wechselt:
     links   echte Fotos (Burger, Pizza) + Smash Burger
     Mitte   alle Burger 01–13
     rechts  alle Pizzen 65–76 mit 30 cm / 40 cm
   Bewegung: Fotos mit langsamem Zoom, Einblendungen laufen alle 60 s neu.
   Fire TV Stick: nur transform / opacity / clip-path, keine Filter.
   ======================================================================= */

:root{
  --bg:#111417; --green:#00E676; --gold:#FF9F1C;
  --white:#fff; --muted:rgba(255,255,255,.64); --line:rgba(255,255,255,.09);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--white);
  font-family:'Poppins',system-ui,sans-serif;transform-origin:top left;
}
#board{
  position:relative;width:1920px;height:1080px;padding:18px 34px 0;display:flex;flex-direction:column;
  background:
    radial-gradient(56% 42% at 16% 2%,  rgba(0,230,118,.14), transparent 62%),
    radial-gradient(50% 40% at 92% 98%, rgba(255,159,28,.12), transparent 62%);
}

/* ---------- Kopf ---------- */
header{display:flex;align-items:center;gap:20px;flex:none;height:86px;}
.mark{width:70px;height:70px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:38px;
  border:3px solid var(--green);background:rgba(0,230,118,.08);box-shadow:0 0 28px rgba(0,230,118,.22) inset;}
.brand h1{font-family:'Bebas Neue',sans-serif;font-size:62px;line-height:.88;letter-spacing:5px;
  background:linear-gradient(92deg,var(--white),var(--green) 55%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.brand p{font-size:17px;letter-spacing:6px;text-transform:uppercase;color:var(--muted);margin-top:3px;}
.hours{margin-left:auto;text-align:right;font-family:'Montserrat',sans-serif;}
.hours .a{font-size:25px;font-weight:900;letter-spacing:2px;color:var(--gold);}
.hours .b{font-size:18px;font-weight:800;margin-top:4px;color:var(--muted);}

/* ---------- Raster ---------- */
#grid{flex:1;min-height:0;display:grid;grid-template-columns:470px 1fr 570px;gap:20px;margin-top:8px;}
.col{display:flex;flex-direction:column;gap:16px;min-height:0;}
.card{
  background:linear-gradient(180deg,rgba(23,28,32,.94),rgba(17,20,23,.94));
  border:1.5px solid var(--line);border-radius:20px;padding:14px 18px;
  display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0;
}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--green),var(--gold));}
.play .card{animation:cardIn .7s cubic-bezier(.22,1,.36,1) calc(var(--c)*.1s) both;}
@keyframes cardIn{from{opacity:0;transform:translateY(34px);} to{opacity:1;transform:none;}}

/* ---------- Videofenster (Burger- und Pizza-Zubereitung nacheinander) ---------- */
.shot{position:relative;flex:none;height:320px;border-radius:20px;overflow:hidden;border:1.5px solid var(--line);background:#000;}
.shot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.shot::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,rgba(10,12,14,.93) 0%,rgba(10,12,14,.12) 44%,transparent 68%);}
.shot .cap{position:absolute;left:18px;right:18px;bottom:14px;z-index:2;display:flex;align-items:flex-end;gap:14px;}
.shot .cap .t{font-family:'Bebas Neue',sans-serif;font-size:42px;line-height:1;letter-spacing:2px;}
.shot .cap .t b{display:block;font-family:'Poppins';font-weight:300;font-size:18px;color:var(--muted);letter-spacing:0;}
.shot .cap .p{margin-left:auto;font-family:'Montserrat',sans-serif;font-weight:900;font-size:32px;
  color:#0b0f11;background:linear-gradient(135deg,var(--green),var(--gold));padding:6px 18px;border-radius:12px;white-space:nowrap;}

/* ---------- Kategorie-Kopf ---------- */
.head{display:flex;align-items:flex-end;gap:10px;padding-bottom:7px;margin-bottom:4px;
  border-bottom:2px solid rgba(255,255,255,.13);flex:none;}
.sec + .sec .head{margin-top:10px;}
.play .head{animation:wipe .7s cubic-bezier(.22,1,.36,1) calc(.12s + var(--c)*.1s) both;}
@keyframes wipe{from{clip-path:inset(0 100% 0 0);} to{clip-path:inset(0 0 0 0);}}
.head .ico{font-size:31px;line-height:1;}
.head h2{font-family:'Bebas Neue',sans-serif;font-size:46px;letter-spacing:2.5px;line-height:1;
  background:linear-gradient(90deg,var(--white),var(--green));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.head .sizes{margin-left:auto;display:flex;gap:12px;}
.head .sizes span{width:84px;text-align:right;font-size:14px;font-weight:800;color:var(--gold);
  font-family:'Montserrat',sans-serif;letter-spacing:1px;text-transform:uppercase;}

/* ---------- Zeile ---------- */
.row{display:flex;align-items:center;gap:10px;padding:3px 5px;border-radius:9px;position:relative;}
.row + .row{border-top:1px solid rgba(255,255,255,.06);}
.play .row{animation:rowIn .5s cubic-bezier(.22,1,.36,1) calc(.25s + var(--c)*.1s + var(--i)*.045s) both;}
@keyframes rowIn{from{opacity:0;transform:translateY(26px);} to{opacity:1;transform:none;}}
.row .no{font-family:'Montserrat',sans-serif;font-weight:900;font-size:18px;color:var(--gold);width:30px;flex:none;}
.row .tx{flex:1;min-width:0;}
.row .nm{font-size:28px;font-weight:600;line-height:1.16;}
.row .ig{font-size:17px;font-weight:300;color:var(--muted);line-height:1.2;margin-top:1px;}
.row .pr{font-family:'Montserrat',sans-serif;font-weight:900;font-size:30px;color:var(--gold);
  width:84px;text-align:right;flex:none;white-space:nowrap;}
.row .pr.two{color:var(--white);}
.play .row .pr{animation:pop .45s cubic-bezier(.34,1.56,.64,1) calc(.4s + var(--c)*.1s + var(--i)*.045s) both;}
@keyframes pop{0%{opacity:0;transform:scale(.65);}60%{opacity:1;transform:scale(1.16);}100%{transform:scale(1);}}

.row.best{background:rgba(0,230,118,.09);box-shadow:inset 0 0 0 1.5px rgba(0,230,118,.32);}
.play .row.best{animation:rowIn .5s cubic-bezier(.22,1,.36,1) calc(.25s + var(--c)*.1s + var(--i)*.045s) both,
                          beat 7s ease-in-out 2s infinite;}
@keyframes beat{0%,88%,100%{transform:scale(1);}94%{transform:scale(1.03);}}
.tag{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:900;letter-spacing:1.1px;
  padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle;white-space:nowrap;}
.tag.b{background:var(--green);color:#0b0f11;}
.tag.v{border:1px solid var(--green);color:var(--green);}
.hint{font-size:18px;font-style:italic;color:var(--green);padding-top:6px;}

/* ---------- Ticker ---------- */
footer{flex:none;height:66px;display:flex;align-items:center;padding:10px 0;}
#ticker{flex:1;height:46px;border-radius:11px;overflow:hidden;display:flex;align-items:center;
  border:1.5px solid rgba(0,230,118,.28);background:rgba(0,230,118,.06);}
#ticker .tr{display:flex;white-space:nowrap;animation:scroll 38s linear infinite;}
#ticker .tr span{font-family:'Montserrat',sans-serif;font-weight:900;font-size:21px;letter-spacing:4px;
  padding:0 52px;text-transform:uppercase;}
@keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
</style>
</head>
<body>
<div id="board" class="play">

  <header>
    <div class="mark">☘</div>
    <div class="brand">
      <h1>KLEEFOOD</h1>
      <p>Burger • Pizza • Fingerfood</p>
    </div>
    <div class="hours">
      <div class="a">TÄGLICH 11:00 – 23:00 UHR</div>
      <div class="b">TEL. 0511 569 575 67 · Kirchröder Str. 77, Hannover</div>
    </div>
  </header>

  <div id="grid">
    <!-- Spalte 1: echte Fotos + Smash Burger -->
    <div class="col" style="--c:0">
      <div class="shot">
        <video id="clip" muted playsinline preload="auto"></video>
        <div class="cap">
          <div class="t" id="clipTitle"></div>
          <div class="p" id="clipPrice"></div>
        </div>
      </div>
      <div class="card" id="smash"></div>
    </div>

    <!-- Spalte 2: alle Burger -->
    <div class="col" style="--c:1"><div class="card" id="burger"></div></div>

    <!-- Spalte 3: alle Pizzen -->
    <div class="col" style="--c:2"><div class="card" id="pizza"></div></div>
  </div>

  <footer><div id="ticker"><div class="tr" id="tr"></div></div></footer>
</div>

<script>
/* =======================================================================
   INHALTE – Burger, Smash Burger und Pizza aus der KLEEFOOD-Karte.
   Fingerfood, Beilagen, Vegetarisch, Dips und Spar Menü laufen auf Screen 2.
   Eigene Fotos? Einfach die URLs in PHOTOS auf z. B. "fotos/burger.jpg" ändern.
   ======================================================================= */
/* Videoschleife: erst wird der Burger gemacht, dann die Pizza.
   vid = Mixkit-ID (eigene Aufnahme? stattdessen full:"videos/x.mp4")
   secs = wie lange der Clip laufen soll                                   */
const CLIP_RES = 360;                      // kleines Fenster -> 360p reicht
const CLIPS = [
  /* Burger */
  {vid:12041, secs:8, t:"SO ENTSTEHT DEIN BURGER", s:"Patty auf dem heißen Grill",         p:"ab 6,00 €"},
  {vid:12016, secs:8, t:"SO ENTSTEHT DEIN BURGER", s:"Frisch gestapelt, täglich geschnitten", p:"ab 6,00 €"},
  {vid:11760, secs:8, t:"SO ENTSTEHT DEIN BURGER", s:"Hausgemachte Saucen",                p:"ab 6,00 €"},
  {vid:36582, secs:8, t:"SO ENTSTEHT DEIN BURGER", s:"Pommes dazu – mit Handschuhen angerichtet", p:"Menü 12,90 €"},
  /* Pizza */
  {vid:42473, secs:8, t:"STEINOFEN-PIZZA",         s:"Tomatensoße auf frischem Teig",      p:"ab 7,00 €"},
  {vid:32415, secs:8, t:"STEINOFEN-PIZZA",         s:"Direkt aus dem Steinofen",           p:"ab 7,00 €"},
  {vid:1666,  secs:8, t:"STEINOFEN-PIZZA",         s:"Frisch aufgeschnitten",              p:"ab 7,00 €"}
];
/* Eigenes Video (z. B. euer Koch mit Handschuhen beim Belegen)?
   Datei nach videos/ legen und hier eintragen:
   {full:"videos/pizza-belegen.mp4", secs:10, t:"STEINOFEN-PIZZA", s:"Frisch belegt", p:"ab 7,00 €"} */

const TICKER = "🔥 TÄGLICH FRISCH • 100 % RIND • HAUSGEMACHTE SAUCEN • STEINOFEN-PIZZA IN 30 & 40 CM • SPAR MENÜ 12,90 € 🔥";

const SECTIONS = {
  burger: { ico:"🍔", title:"KLEE BURGER", items:[
    {no:"01", nm:"Classic Hamburger",      ig:"Rindfleisch-Patty",                             pr:"6,00"},
    {no:"02", nm:"Cheeseburger",           ig:"Rindfleisch-Patty, Cheddar-Käse",               pr:"6,50"},
    {no:"03", nm:"Chili Cheeseburger",     ig:"Cheddar-Käse, Jalapeños, Chili-Sauce",          pr:"7,00"},
    {no:"04", nm:"Kleefood BBQ Burger",    ig:"Cheddar-Käse, Bacon, Barbecue-Sauce",           pr:"7,50", best:true},
    {no:"05", nm:"Cremig Avocado Burger",  ig:"Guacamole, Beef-Patty",                         pr:"7,50"},
    {no:"06", nm:"Mushroom & Blue Cheese", ig:"Pesto, Champignons, Schmorzwiebeln",            pr:"7,50"},
    {no:"07", nm:"Halloumi & Aubergine",   ig:"Halloumi, Aubergine, Honey Mustard",            pr:"7,50", veg:true},
    {no:"08", nm:"Mozzarella Burger",      ig:"Pesto, Aioli, Mozzarella, Röstzwiebeln",        pr:"8,00"},
    {no:"09", nm:"Chicken Classic Burger", ig:"Gegrilltes Chicken",                            pr:"5,50"},
    {no:"10", nm:"Crunchy Chicken Burger", ig:"Crunchy Chicken mit Cheese nach Wahl",          pr:"6,50"},
    {no:"11", nm:"Beyond Burger original", ig:"Pflanzliches Patty, Ketchup",                   pr:"8,00", veg:true},
    {no:"12", nm:"BBQ Burger Avocado",     ig:"Cheddar, Barbecue-Sauce, Avocado",              pr:"9,00"},
    {no:"13", nm:"Kleefeld Special Burger",ig:"2 Mozzarella-Sticks, Zwiebelringe, Röstzwiebeln",pr:"10,00", best:true}
  ], note:"100 % Rind · alle Burger mit Ketchup, Mayonnaise, Tomaten, sauren Gurken, Senf, Zwiebeln & Mixed-Salat" },

  smash: { ico:"🥩", title:"SMASH BURGER", hint:"Doppeltes Beef-Patty  +2,50 €", items:[
    {no:"15", nm:"Hamburger Smash",    ig:"",              pr:"4,00"},
    {no:"16", nm:"Cheeseburger Smash", ig:"",              pr:"4,50"},
    {no:"17", nm:"Chili Cheese Smash", ig:"mit Jalapeños", pr:"5,00"},
    {no:"18", nm:"BBQ Burger Smash",   ig:"mit BBQ-Sauce", pr:"5,00"},
    {no:"19", nm:"Chicken Burger Smash",ig:"mit Aioli",    pr:"5,00"}
  ]},

  pizza: { ico:"🍕", title:"STONE OVEN PIZZA", sizes:["30 cm","40 cm"], items:[
    {no:"65", nm:"Margharita",    ig:"Tomatensoße & Käse",                        pr:"7,00",  pr2:"12,00"},
    {no:"66", nm:"Tonno",         ig:"Thunfisch, Zwiebeln",                       pr:"9,00",  pr2:"16,00"},
    {no:"67", nm:"Kleefood",      ig:"Putenschinken, Paprika, Champignons, Jalapeños", pr:"9,50", pr2:"16,00", best:true},
    {no:"68", nm:"Salami",        ig:"Geflügel-Salami",                           pr:"9,50",  pr2:"16,00"},
    {no:"69", nm:"Putenschinken", ig:"Putenschinken",                             pr:"9,50",  pr2:"16,00"},
    {no:"70", nm:"Hawaii",        ig:"Putenschinken & Ananas",                    pr:"9,50",  pr2:"16,00"},
    {no:"71", nm:"Funghi",        ig:"Frische Champignons, Peperoni",             pr:"9,50",  pr2:"16,00"},
    {no:"72", nm:"Fiori",         ig:"Geflügel-Salami, Champignons, Peperoni",    pr:"10,00", pr2:"18,00"},
    {no:"73", nm:"Sucuk",         ig:"Knoblauchwurst",                            pr:"9,50",  pr2:"16,00"},
    {no:"74", nm:"BBQ",           ig:"Hähnchenbrust, Zwiebeln, Mais, BBQ-Sauce",  pr:"10,00", pr2:"18,00"},
    {no:"75", nm:"Picante",       ig:"Salami, Zwiebeln, Jalapeños, Oliven",       pr:"10,00", pr2:"18,00"},
    {no:"76", nm:"Garnelen",      ig:"mit Knoblauch",                             pr:"10,00", pr2:"18,00"}
  ], note:"Alle Pizzen mit Tomatensoße &amp; Käse" }
};

/* ---------- Aufbau ---------- */
document.getElementById('tr').innerHTML = '<span>' + TICKER + '</span><span>' + TICKER + '</span>';

function renderSection(sec){
  const sizes = sec.sizes ? '<div class="sizes">' + sec.sizes.map(s => '<span>' + s + '</span>').join('') + '</div>' : '';
  const rows = sec.items.map((it,i) =>
    '<div class="row' + (it.best ? ' best' : '') + '" style="--i:' + i + '">' +
      '<div class="no">' + it.no + '</div>' +
      '<div class="tx"><div class="nm">' + it.nm +
        (it.best ? '<span class="tag b">★ TOP</span>' : '') +
        (it.veg  ? '<span class="tag v">VEGGIE</span>' : '') +
      '</div>' + (it.ig ? '<div class="ig">' + it.ig + '</div>' : '') + '</div>' +
      '<div class="pr">' + it.pr + '</div>' +
      (it.pr2 !== undefined ? '<div class="pr two">' + it.pr2 + '</div>' : '') +
    '</div>').join('');
  return '<div class="head"><span class="ico">' + sec.ico + '</span><h2>' + sec.title + '</h2>' + sizes + '</div>' +
         rows + (sec.hint ? '<div class="hint">' + sec.hint + '</div>' : '');
}

document.getElementById('burger').innerHTML = renderSection(SECTIONS.burger);
document.getElementById('smash').innerHTML  = renderSection(SECTIONS.smash);
document.getElementById('pizza').innerHTML  = renderSection(SECTIONS.pizza);

/* ---------- Videoschleife: ein Clip nach dem anderen ---------- */
const clip = document.getElementById('clip');
const clipTitle = document.getElementById('clipTitle');
const clipPrice = document.getElementById('clipPrice');
let ci = -1, clipTimer = null;

function nextClip(){
  ci = (ci + 1) % CLIPS.length;
  const c = CLIPS[ci];
  clip.src = c.full || ('https://assets.mixkit.co/videos/' + c.vid + '/' + c.vid + '-' + CLIP_RES + '.mp4');
  clip.loop = true;                       // kurze Clips laufen bis zum Weiterschalten
  clip.play().catch(() => {});
  clipTitle.innerHTML = c.t + '<b>' + c.s + '</b>';
  clipPrice.textContent = c.p;
  clearTimeout(clipTimer);
  clipTimer = setTimeout(nextClip, c.secs * 1000);
}
nextClip();

/* ---------- Einblendungen alle 60 s neu starten, damit Bewegung drin bleibt ---------- */
const board = document.getElementById('board');
setInterval(() => {
  board.classList.remove('play');
  void board.offsetWidth;              // Reflow -> Animationen starten neu
  board.classList.add('play');
}, 60000);

/* ---------- Auto-Skalierung auf abweichende Displaygrößen ---------- */
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  document.body.style.transform = 'scale(' + s + ')';
}
addEventListener('resize', fit); fit();
</script>
</body>
</html>
