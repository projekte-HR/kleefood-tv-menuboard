<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KLEEFOOD – Screen 1 – Burger & Fries</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800;900&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
</head>
<body>

<!-- SCREEN 1 (1920x1080) – Seite 1 des Aufstellers
     Spalte 1  Smash Burger · Beilagen · Schüler-Aktion
     Spalte 2  Hamburger 01–14 und 20
     Spalte 3  Foto + Spar Menü
     Inhalte und Preise stehen in menu.js, das Design in board.css        -->

<div id="stage" class="quer">
  <div id="wolken"></div>

  <header>
    <img class="logo" src="logo.jpg" alt="KleeFood">
    <div class="marke">
      <h1>KLEE<em>FOOD</em></h1>
      <p>Burger · Pizza · Fingerfood</p>
    </div>
    <div class="kopf-rechts">
      <div class="gross">BURGER <em>& FRIES</em></div>
      <div class="klein" id="tel"></div>
    </div>
  </header>

  <div id="raster">
    <div class="spalte" style="--c:0;width:470px;flex:0 0 470px"><div class="karte" id="s1"></div></div>
    <div class="spalte" style="--c:1;flex:1 1 auto"><div class="karte" id="s2"></div></div>
    <div class="spalte" style="--c:2;width:560px;flex:0 0 560px" id="s3"></div>
  </div>

  <footer><div id="laufband"></div></footer>
</div>

<script src="menu.js"></script>
<script src="board.js"></script>
<script>
document.getElementById('tel').textContent = TELEFON;

document.getElementById('s1').innerHTML =
  block(MENU.smash) + block(MENU.beilagen) + aktionBlock();

document.getElementById('s2').innerHTML =
  block(MENU.hamburger);

document.getElementById('s3').innerHTML =
  bildBlock('fotos/hero.jpg', 'BURGER & FRIES', '100 % Rind · hausgemachte Saucen', 'ab 4,50 €', 250) +
  '<div class="karte">' + sparBlock() + '</div>';

document.getElementById('laufband').innerHTML = laufband(TICKER.links);

starten();
</script>
</body>
</html>
