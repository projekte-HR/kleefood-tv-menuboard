<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KLEEFOOD – Screen 1 – Burger & Pizza</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800;900&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
/* =======================================================================
   KLEEFOOD – SCREEN 1 (1920x1080)
   Alles gleichzeitig sichtbar, nichts wechselt:
     links   echte Fotos (Burger, Pizza) + Smash Burger
     Mitte   alle Burger 01–13
     rechts  alle Pizzen 65–76 mit 30 cm / 40 cm
   Bewegung: Fotos mit langsamem Zoom, Einblendungen laufen alle 60 s neu.
   Fire TV Stick: nur transform / opacity / clip-path, keine Filter.
   ======================================================================= */

:root{
  --bg:#111417; --green:#00E676; --gold:#FF9F1C;
  --white:#fff; --muted:rgba(255,255,255,.64); --line:rgba(255,255,255,.09);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--white);
  font-family:'Poppins',system-ui,sans-serif;transform-origin:top left;
}
#board{
  position:relative;width:1920px;height:1080px;padding:18px 34px 0;display:flex;flex-direction:column;
  background:
    radial-gradient(56% 42% at 16% 2%,  rgba(0,230,118,.14), transparent 62%),
    radial-gradient(50% 40% at 92% 98%, rgba(255,159,28,.12), transparent 62%);
}

/* ---------- Kopf ---------- */
header{display:flex;align-items:center;flex:none;height:86px;}
header .mark{margin-right:20px;}
.mark{width:70px;height:70px;flex:none;border-radius:50%;font-size:38px;
  display:flex;align-items:center;justify-content:center;
  border:3px solid var(--green);background:rgba(0,230,118,.08);box-shadow:0 0 28px rgba(0,230,118,.22) inset;}
.brand h1{font-family:'Bebas Neue',sans-serif;font-size:62px;line-height:.88;letter-spacing:5px;
  background:linear-gradient(92deg,var(--white),var(--green) 55%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.brand p{font-size:17px;letter-spacing:6px;text-transform:uppercase;color:var(--muted);margin-top:3px;}
.hours{margin-left:auto;text-align:right;font-family:'Montserrat',sans-serif;}
.hours .a{font-size:25px;font-weight:900;letter-spacing:2px;color:var(--gold);}
.hours .b{font-size:18px;font-weight:800;margin-top:4px;color:var(--muted);}

/* ---------- Raster ---------- */
/* Flexbox statt CSS Grid: laeuft auch auf sehr alten TV-Browsern */
#grid{flex:1;min-height:0;display:flex;margin-top:8px;}
.col{display:flex;flex-direction:column;min-height:0;}
.col:nth-child(1){width:470px;flex:0 0 470px;margin-right:20px;}
.col:nth-child(2){flex:1 1 auto;min-width:0;margin-right:20px;}
.col:nth-child(3){width:570px;flex:0 0 570px;}
.col > * + *{margin-top:16px;}
.card{
  background:linear-gradient(180deg,rgba(23,28,32,.94),rgba(17,20,23,.94));
  border:1.5px solid var(--line);border-radius:20px;padding:14px 18px;
  display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0;
}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--green),var(--gold));}
.play .card{animation:cardIn .7s cubic-bezier(.22,1,.36,1) calc(var(--c)*.1s) both;}
@keyframes cardIn{from{opacity:0;transform:translateY(34px);} to{opacity:1;transform:none;}}

/* ---------- Bildfenster (Burger und Pizza im Wechsel) ---------- */
.shot{position:relative;flex:none;height:320px;border-radius:20px;overflow:hidden;border:1.5px solid var(--line);background:#000;}
.shot .pic{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background-position:center;background-size:cover;background-repeat:no-repeat;
  opacity:0;transition:opacity .8s ease;
}
.shot .pic.on{opacity:1;}
.shot::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;
  background:linear-gradient(0deg,rgba(10,12,14,.93) 0%,rgba(10,12,14,.12) 44%,transparent 68%);}
.shot .cap{position:absolute;left:18px;right:18px;bottom:14px;z-index:2;display:flex;align-items:flex-end;}
.shot .cap .t{font-family:'Bebas Neue',sans-serif;font-size:42px;line-height:1;letter-spacing:2px;}
.shot .cap .t b{display:block;font-family:'Poppins';font-weight:300;font-size:18px;color:var(--muted);letter-spacing:0;}
.shot .cap .p{margin-left:auto;font-family:'Montserrat',sans-serif;font-weight:900;font-size:32px;
  color:#0b0f11;background:linear-gradient(135deg,var(--green),var(--gold));padding:6px 18px;border-radius:12px;white-space:nowrap;}

/* ---------- Kategorie-Kopf ---------- */
.head{display:flex;align-items:flex-end;padding-bottom:7px;margin-bottom:4px;
  border-bottom:2px solid rgba(255,255,255,.13);flex:none;}
.sec + .sec .head{margin-top:10px;}
.play .head{animation:wipe .7s cubic-bezier(.22,1,.36,1) calc(.12s + var(--c)*.1s) both;}
@keyframes wipe{from{clip-path:inset(0 100% 0 0);} to{clip-path:inset(0 0 0 0);}}
.head .ico{font-size:31px;line-height:1;margin-right:10px;}
.head h2{font-family:'Bebas Neue',sans-serif;font-size:46px;letter-spacing:2.5px;line-height:1;
  background:linear-gradient(90deg,var(--white),var(--green));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.head .sizes{margin-left:auto;display:flex;}
.head .sizes span + span{margin-left:12px;}
.head .sizes span{width:84px;text-align:right;font-size:14px;font-weight:800;color:var(--gold);
  font-family:'Montserrat',sans-serif;letter-spacing:1px;text-transform:uppercase;}

/* ---------- Zeile ---------- */
.row{display:flex;align-items:center;padding:2px 5px;border-radius:9px;position:relative;}
.row + .row{border-top:1px solid rgba(255,255,255,.06);}
.play .row{animation:rowIn .5s cubic-bezier(.22,1,.36,1) calc(.25s + var(--c)*.1s + var(--i)*.045s) both;}
@keyframes rowIn{from{opacity:0;transform:translateY(26px);} to{opacity:1;transform:none;}}
.row .no{font-family:'Montserrat',sans-serif;font-weight:900;font-size:18px;color:var(--gold);width:30px;flex:none;margin-right:10px;}
.row .tx{flex:1;min-width:0;}
.row .nm{font-size:28px;font-weight:600;line-height:1.16;}
.row .ig{font-size:17px;font-weight:300;color:var(--muted);line-height:1.2;margin-top:1px;}
.row .pr{font-family:'Montserrat',sans-serif;font-weight:900;font-size:30px;color:var(--gold);
  width:84px;text-align:right;flex:none;white-space:nowrap;margin-left:10px;}
.row .pr.two{color:var(--white);}
.play .row .pr{animation:pop .45s cubic-bezier(.34,1.56,.64,1) calc(.4s + var(--c)*.1s + var(--i)*.045s) both;}
@keyframes pop{0%{opacity:0;transform:scale(.65);}60%{opacity:1;transform:scale(1.16);}100%{transform:scale(1);}}

.row.best{background:rgba(0,230,118,.09);box-shadow:inset 0 0 0 1.5px rgba(0,230,118,.32);}
.play .row.best{animation:rowIn .5s cubic-bezier(.22,1,.36,1) calc(.25s + var(--c)*.1s + var(--i)*.045s) both,
                          beat 7s ease-in-out 2s infinite;}
@keyframes beat{0%,88%,100%{transform:scale(1);}94%{transform:scale(1.03);}}
.tag{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:900;letter-spacing:1.1px;
  padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle;white-space:nowrap;}
.tag.b{background:var(--green);color:#0b0f11;}
.tag.v{border:1px solid var(--green);color:var(--green);}
.tag.d{background:var(--gold);color:#0b0f11;}
.row.deal{box-shadow:inset 0 0 0 1.5px rgba(255,159,28,.42);background:rgba(255,159,28,.09);}
.row .alt{
  font-family:'Montserrat',sans-serif;font-weight:800;font-size:19px;color:rgba(255,255,255,.45);
  text-decoration:line-through;margin-left:10px;white-space:nowrap;flex:none;
}
.hint{font-size:18px;font-style:italic;color:var(--green);padding-top:6px;}

/* ---------- Ticker ---------- */
footer{flex:none;height:66px;display:flex;align-items:center;padding:10px 0;}
#ticker{flex:1;height:46px;border-radius:11px;overflow:hidden;display:flex;align-items:center;
  border:1.5px solid rgba(0,230,118,.28);background:rgba(0,230,118,.06);}
#ticker .tr{display:flex;white-space:nowrap;animation:scroll 38s linear infinite;}
#ticker .tr span{font-family:'Montserrat',sans-serif;font-weight:900;font-size:21px;letter-spacing:4px;
  padding:0 52px;text-transform:uppercase;}
@keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
</style>
</head>
<body>
<div id="board" class="play">

  <header>
    <div class="mark">☘</div>
    <div class="brand">
      <h1>KLEEFOOD</h1>
      <p>Burger • Pizza • Fingerfood</p>
    </div>
    <div class="hours">
      <div class="a">TEL. 0511 569 575 67</div>
    </div>
  </header>

  <div id="grid">
    <!-- Spalte 1: echte Fotos + Smash Burger -->
    <div class="col" style="--c:0">
      <div class="shot">
        <div class="pic" id="shotA"></div>
        <div class="pic" id="shotB"></div>
        <div class="cap">
          <div class="t" id="clipTitle"></div>
          <div class="p" id="clipPrice"></div>
        </div>
      </div>
      <div class="card" id="smash"></div>
    </div>

    <!-- Spalte 2: alle Burger -->
    <div class="col" style="--c:1"><div class="card" id="burger"></div></div>

    <!-- Spalte 3: alle Pizzen -->
    <div class="col" style="--c:2"><div class="card" id="pizza"></div></div>
  </div>

  <footer><div id="ticker"><div class="tr" id="tr"></div></div></footer>
</div>

<script>
/* =======================================================================
   INHALTE – Burger, Smash Burger und Pizza aus der KLEEFOOD-Karte.
   Fingerfood, Beilagen, Vegetarisch, Dips und Spar Menü laufen auf Screen 2.
   Eigene Fotos? Einfach die URLs in PHOTOS auf z. B. "fotos/burger.jpg" ändern.
   ======================================================================= */
/* Zwei Bilder im Wechsel – keine Videos mehr, damit der Fire TV Stick
   nichts dekodieren muss. Bilder liegen lokal im Ordner fotos/.          */
const V = "?v=2";                       // erzwingt Neuladen nach Bildtausch

const SHOTS = [
  {img:"fotos/burger.jpg", t:"KLEEFOOD BBQ BURGER", s:"Cheddar-Käse, Bacon, Barbecue-Sauce · statt 12,50 €", p:"9,90 €"},
  {img:"fotos/pizza.jpg",  t:"PIZZA KLEEFOOD",    s:"Putenschinken, Paprika, fr. Champignon, Jalapeños",  p:"11,50 €"}
];
const SHOT_MS = 8000;   // Wechsel alle 8 Sekunden

const TICKER = "🔥 ANGEBOTE: KLEEFOOD BBQ BURGER 9,90 € • MOZZARELLA BURGER 9,00 € • BBQ AVOCADO 9,00 € • SPAR MENÜ AB 14,90 € • PIZZA AUF DEM ANDEREN SCREEN 🔥";

const SECTIONS = {
  hamburger: { ico:"🍔", title:"HAMBURGER", items:[
    {no:"01", nm:"Classic Hamburger",          ig:"Rindfleisch-Patty",                                          pr:"9,50"},
    {no:"02", nm:"Cheeseburger",               ig:"Rindfleisch-Patty, Cheddar-Käse",                            pr:"10,50", best:"6"},
    {no:"04", nm:"Kleefood BBQ Burger",        ig:"Cheddar-Käse, Bacon, Barbecue-Sauce",                        pr:"9,90",  alt:"12,50"},
    {no:"05", nm:"Kleefood cremig Avocado",    ig:"Guacamole, Beef-Patty",                                      pr:"8,00"},
    {no:"06", nm:"Grilled Mushroom & Blue Cheese", ig:"Pesto, gegrillte Champignons, Schmorzwiebeln, Blue Cheese", pr:"13,50"},
    {no:"07", nm:"Halloumi & Aubergine",       ig:"Halloumi, gegrillte Aubergine, Honey Mustard Soße",          pr:"9,50"},
    {no:"08", nm:"Mozzarella Burger",          ig:"Beef-Patty, Pesto, Aioli, Mozzarella, Röstzwiebeln",         pr:"9,00",  alt:"11,50"},
    {no:"10", nm:"Crunchy Chicken Burger",     ig:"Crunchy Chicken mit Cheese nach Wahl",                       pr:"11,50"},
    {no:"11", nm:"Beyond Burger Original",     ig:"Pflanzliches Patty, Ketchup",                                pr:"12,50", veg:true},
    {no:"12", nm:"BBQ Burger Avocado",         ig:"Cheddar, Bacon, Barbecue-Sauce, Avocado",                    pr:"9,00",  alt:"13,90"},
    {no:"13", nm:"Kleefeld Special Burger",    ig:"2 Mozzarella-Sticks, 2 Zwiebelringe, Röstzwiebeln, Sauce nach Wahl", pr:"11,00", alt:"12,00"}
  ]},

  smash: { ico:"🥩", title:"SMASH BURGER", items:[
    {no:"15", nm:"Hamburger Smash",        ig:"",                 pr:"5,00"},
    {no:"16", nm:"Cheeseburger Smash",     ig:"",                 pr:"5,50", best:"1"},
    {no:"17", nm:"Chili Cheese Burger Smash", ig:"Mit Jalapeños", pr:"6,00", best:"3"},
    {no:"18", nm:"BBQ Burger Smash",       ig:"Mit BBQ-Sauce",    pr:"6,00"},
    {no:"19", nm:"Chicken Burger",         ig:"Mit Aioli",        pr:"6,00"}
  ]},

  kids: { ico:"🧒", title:"KIDS MENÜ", items:[
    {no:"", nm:"Kids Menü Smash Burger", ig:"4 Nuggets + Pommes + Capri Sun", pr:"9,50"}
  ]},

  beilagen: { ico:"🍟", title:"BEILAGEN", items:[
    {no:"25", nm:"BBQ Fries",           ig:"BBQ-Sauce, Bacon, Röstzwiebeln",   pr:"6,00"},
    {no:"26", nm:"Chili Cheese Fries",  ig:"Jalapeños, Käse",                  pr:"6,00"},
    {no:"27", nm:"Garlic Fries",        ig:"Parmesan, Petersilie, Knoblauch",  pr:"6,00"},
    {no:"28", nm:"Süßkartoffel-Pommes", ig:"",                                 pr:"5,90", best:"7", veg:true},
    {no:"29", nm:"Pommes Fries",        ig:"",                                 pr:"4,50", best:"4", veg:true},
    {no:"30", nm:"Curly Fries",         ig:"",                                 pr:"5,50", veg:true},
    {no:"31", nm:"Coleslaw",            ig:"Krautsalat",                       pr:"2,50", veg:true}
  ]},

  veg: { ico:"🥙", title:"VEGETARISCH", items:[
    {no:"35", nm:"Falafel Rolle",          ig:"4 Stück mit Salat und Soße",              pr:"6,50",  veg:true},
    {no:"36", nm:"XL Falafel Rolle",       ig:"6 Stück mit Salat und Soße",              pr:"8,00",  veg:true},
    {no:"37", nm:"Falafel Teller",         ig:"6 Stück, Reis oder Pommes, Salat & Soße", pr:"12,00", veg:true},
    {no:"38", nm:"Halloumi mit Falafel Rolle", ig:"3 Halloumi, 3 Falafel mit Salat und Soße", pr:"9,50", veg:true}
  ]}
};

/* ---------- Aufbau ---------- */
document.getElementById('tr').innerHTML = '<span>' + TICKER + '</span><span>' + TICKER + '</span>';

function renderSection(sec){
  const sizes = sec.sizes ? '<div class="sizes">' + sec.sizes.map(s => '<span>' + s + '</span>').join('') + '</div>' : '';
  const rows = sec.items.map((it,i) =>
    '<div class="row' + (it.best ? ' best' : '') + (it.alt ? ' deal' : '') + '" style="--i:' + i + '">' +
      '<div class="no">' + (it.no || '') + '</div>' +
      '<div class="tx"><div class="nm">' + it.nm +
        (it.best ? '<span class="tag b">\u2605 TOP ' + it.best + '</span>' : '') +
        (it.veg  ? '<span class="tag v">VEGGIE</span>' : '') +
        (it.alt  ? '<span class="tag d">ANGEBOT</span>' : '') +
      '</div>' + (it.ig ? '<div class="ig">' + it.ig + '</div>' : '') + '</div>' +
      (it.alt ? '<div class="alt">' + it.alt + '</div>' : '') +
      '<div class="pr">' + it.pr + '</div>' +
      (it.pr2 !== undefined ? '<div class="pr two">' + it.pr2 + '</div>' : '') +
    '</div>').join('');
  return '<div class="head"><span class="ico">' + sec.ico + '</span><h2>' + sec.title + '</h2>' + sizes + '</div>' +
         rows + (sec.hint ? '<div class="hint">' + sec.hint + '</div>' : '');
}

document.getElementById('smash').innerHTML  = renderSection(SECTIONS.smash) + renderSection(SECTIONS.kids);
document.getElementById('burger').innerHTML = renderSection(SECTIONS.hamburger);
document.getElementById('pizza').innerHTML  = renderSection(SECTIONS.beilagen) + renderSection(SECTIONS.veg);

/* ---------- Bildwechsel: zwei <img>, weich übergeblendet ---------- */
const shotEls = [document.getElementById('shotA'), document.getElementById('shotB')];
const clipTitle = document.getElementById('clipTitle');
const clipPrice = document.getElementById('clipPrice');
let si = -1, front = 0;

SHOTS.forEach((sh,i) => { shotEls[i].style.backgroundImage = 'url(' + sh.img + V + ')'; });

function nextShot(){
  si = (si + 1) % SHOTS.length;
  const sh = SHOTS[si];
  shotEls.forEach((el,n) => el.classList.toggle('on', n === si));
  clipTitle.innerHTML = sh.t + '<b>' + sh.s + '</b>';
  clipPrice.textContent = sh.p;
}
nextShot();
setInterval(nextShot, SHOT_MS);

/* Die Einblendung läuft nur einmal beim Start. Danach bleibt das Bild ruhig
   stehen; die Dauerschleife machen der Bildwechsel und das Laufband.
   Die Seite lädt sich nie neu.                                            */

/* ---------- Auto-Skalierung auf abweichende Displaygrößen ---------- */
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  document.body.style.transform = 'scale(' + s + ')';
}
addEventListener('resize', fit); fit();
</script>
</body>
</html>
