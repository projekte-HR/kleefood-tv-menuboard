<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KLEEFOOD – Screen 1 – Burger & Fries</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800;900&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
</head>
<body>

<!-- SCREEN 1 (1920x1080) – Burger & Fries, vier Seiten im Gleichtakt
     Die Lichtwelle startet hier und läuft weiter auf Screen 2 und 3.
     Inhalte und Preise stehen in menu.js, das Design in board.css        -->

<div id="stage" class="quer">
  <div id="gitter"></div>
  <div id="welle"></div>

  <header>
    <img class="logo" src="logo.jpg" alt="KleeFood">
    <div class="marke">
      <h1>KLEE<em>FOOD</em></h1>
      <p>Burger · Pizza · Fingerfood</p>
    </div>
    <div class="kopf-rechts">
      <div class="gross">BURGER &amp; FRIES</div>
      <div class="klein" id="tel"></div>
    </div>
  </header>

  <div id="seiten"></div>
  <div id="punkte"></div>

  <footer><div id="laufband"></div></footer>
</div>

<script>var SCREEN = 1;</script>
<script src="menu.js"></script>
<script src="board.js"></script>
<script>
document.getElementById('tel').textContent = TELEFON;
document.getElementById('laufband').innerHTML = laufband(TICKER.links);

starten([
  /* Seite 1 – Hamburger 01 bis 08 */
  tafel(block(MENU.hamburger, 0, 8)),

  /* Seite 2 – Hamburger 09 bis 14 und 20 */
  tafel(block(MENU.hamburger, 8)),

  /* Seite 3 – Smash Burger, Schüler-Aktion und das Foto */
  tafel(block(MENU.smash) + aktionBlock()) +
  tafel(bildBlock('fotos/hero.jpg', 'BURGER &amp; FRIES',
                  '100 % Rind · hausgemachte Saucen', 'ab 4,50 €', 760)),

  /* Seite 4 – Beilagen und Spar Menü */
  tafel(block(MENU.beilagen)) +
  tafel(sparBlock())
]);
</script>
</body>
</html>
