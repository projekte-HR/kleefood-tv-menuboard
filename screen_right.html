<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KLEEFOOD – Screen 2 – Fingerfood, Beilagen & Deals</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800;900&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
/* =======================================================================
   KLEEFOOD – SCREEN 2 (1920x1080)
   Zweite Hälfte der Karte – Screen 1 zeigt Burger, Smash und Pizza,
   hier stehen Fingerfood, Beilagen, Vegetarisch, Getränke, Dips und das
   Spar Menü. Zwei Seiten im Wechsel, alles groß und in Bewegung.
   Fire TV Stick: animiert wird nur transform / opacity / clip-path.
   Zeiten: PAGE_MS unten im Script · Preise: PAGES unten im Script.
   ======================================================================= */

:root{
  --bg:#111417; --green:#00E676; --gold:#FF9F1C;
  --white:#fff; --muted:rgba(255,255,255,.66); --line:rgba(255,255,255,.09);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--white);
  font-family:'Poppins',system-ui,sans-serif;transform-origin:top left;
}
#board{
  position:relative;width:1920px;height:1080px;padding:26px 46px 0;display:flex;flex-direction:column;
  background:
    radial-gradient(58% 46% at 18% 2%,  rgba(0,230,118,.15), transparent 62%),
    radial-gradient(52% 44% at 90% 98%, rgba(255,159,28,.13), transparent 62%);
}

/* ---------- Kopf ---------- */
header{display:flex;align-items:center;gap:24px;flex:none;height:104px;}
.mark{
  width:88px;height:88px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:46px;
  border:3px solid var(--green);background:rgba(0,230,118,.08);
  box-shadow:0 0 34px rgba(0,230,118,.22) inset;
}
.brand h1{
  font-family:'Bebas Neue',sans-serif;font-size:80px;line-height:.88;letter-spacing:6px;
  background:linear-gradient(92deg,var(--white),var(--green) 55%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand p{font-size:21px;letter-spacing:7px;text-transform:uppercase;color:var(--muted);margin-top:4px;}
.hours{margin-left:auto;text-align:right;font-family:'Montserrat',sans-serif;}
.hours .a{font-size:30px;font-weight:900;letter-spacing:2px;color:var(--gold);}
.hours .b{font-size:22px;font-weight:800;margin-top:6px;color:var(--muted);}

/* ---------- Ticker ---------- */
#ticker{
  margin:12px 0;height:58px;border-radius:12px;overflow:hidden;flex:none;
  border:1.5px solid rgba(0,230,118,.28);background:rgba(0,230,118,.06);display:flex;align-items:center;
}
#ticker .tr{display:flex;white-space:nowrap;animation:scroll 36s linear infinite;}
#ticker .tr span{font-family:'Montserrat',sans-serif;font-weight:900;font-size:26px;letter-spacing:4px;
  padding:0 60px;text-transform:uppercase;}
@keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ---------- Seiten ---------- */
#pages{position:relative;flex:1;min-height:0;}
.page{position:absolute;inset:0;display:grid;grid-template-columns:1.24fr 1fr .92fr;gap:24px;
  opacity:0;visibility:hidden;}
.page.on{opacity:1;visibility:visible;}

.col{
  background:linear-gradient(180deg,rgba(23,28,32,.94),rgba(17,20,23,.94));
  border:1.5px solid var(--line);border-radius:24px;padding:18px 24px 12px;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
.col::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--green),var(--gold));}
.page.on .col{animation:colIn .7s cubic-bezier(.22,1,.36,1) calc(var(--c)*.12s) both;}
@keyframes colIn{from{opacity:0;transform:translateY(46px);} to{opacity:1;transform:none;}}
.col.wide{grid-column:span 2;}

/* Kategorie-Überschrift */
.head{display:flex;align-items:flex-end;gap:14px;padding-bottom:10px;margin-bottom:6px;
  border-bottom:2px solid rgba(255,255,255,.13);}
.sec + .sec .head{margin-top:12px;}
.page.on .head{animation:wipe .75s cubic-bezier(.22,1,.36,1) calc(.15s + var(--c)*.12s) both;}
@keyframes wipe{from{clip-path:inset(0 100% 0 0);} to{clip-path:inset(0 0 0 0);}}
.head .ico{font-size:40px;line-height:1;}
.head h2{
  font-family:'Bebas Neue',sans-serif;font-size:58px;letter-spacing:3px;line-height:1;
  background:linear-gradient(90deg,var(--white),var(--green));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.head .sizes{margin-left:auto;display:flex;gap:16px;}
.head .sizes span{width:92px;text-align:right;font-size:18px;font-weight:800;color:var(--gold);
  font-family:'Montserrat',sans-serif;letter-spacing:1px;text-transform:uppercase;}

/* Gericht */
.row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:12px;position:relative;}
.row + .row{border-top:1px solid rgba(255,255,255,.06);}
.page.on .row{animation:rowIn .55s cubic-bezier(.22,1,.36,1) calc(.3s + var(--c)*.12s + var(--i)*.06s) both;}
@keyframes rowIn{from{opacity:0;transform:translateY(34px);} to{opacity:1;transform:none;}}
.row .no{font-family:'Montserrat',sans-serif;font-weight:900;font-size:21px;color:var(--gold);width:38px;flex:none;}
.row .tx{flex:1;min-width:0;}
.row .nm{font-size:32px;font-weight:600;line-height:1.15;}
.row .ig{font-size:21px;font-weight:300;color:var(--muted);margin-top:2px;line-height:1.2;}
.row .pr{font-family:'Montserrat',sans-serif;font-weight:900;font-size:38px;color:var(--gold);
  width:92px;text-align:right;flex:none;white-space:nowrap;}
.row .pr.two{color:var(--white);}
.page.on .row .pr{animation:pop .5s cubic-bezier(.34,1.56,.64,1) calc(.5s + var(--c)*.12s + var(--i)*.06s) both;}
@keyframes pop{0%{opacity:0;transform:scale(.6);}60%{opacity:1;transform:scale(1.18);}100%{transform:scale(1);}}

.row.best{background:rgba(0,230,118,.09);box-shadow:inset 0 0 0 1.5px rgba(0,230,118,.32);}
.page.on .row.best{animation:rowIn .55s cubic-bezier(.22,1,.36,1) calc(.3s + var(--c)*.12s + var(--i)*.06s) both,
                             beat 6s ease-in-out 2.4s infinite;}
@keyframes beat{0%,88%,100%{transform:scale(1);}94%{transform:scale(1.035);}}
.tag{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:900;letter-spacing:1.3px;
  padding:3px 10px;border-radius:99px;margin-left:10px;vertical-align:middle;white-space:nowrap;}
.tag.b{background:var(--green);color:#0b0f11;}
.tag.v{border:1px solid var(--green);color:var(--green);}

/* Spar Menü als große Karte */
.deal{display:flex;flex-direction:column;height:100%;justify-content:center;gap:26px;padding:10px 4px;}
.deal .kick{font-family:'Bebas Neue',sans-serif;font-size:96px;letter-spacing:5px;line-height:.95;
  background:linear-gradient(92deg,var(--green),var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.deal .sub{font-size:28px;color:var(--muted);margin-top:-10px;}
.opt{
  display:flex;align-items:center;gap:26px;padding:22px 28px;border-radius:20px;
  background:linear-gradient(135deg,rgba(0,230,118,.15),rgba(255,159,28,.15));
  border:2px solid rgba(255,159,28,.55);
}
.page.on .opt{animation:rowIn .6s cubic-bezier(.22,1,.36,1) calc(.5s + var(--i)*.14s) both;}
.opt .n{font-family:'Bebas Neue',sans-serif;font-size:56px;color:var(--gold);line-height:1;width:52px;flex:none;}
.opt .t{flex:1;font-size:31px;font-weight:600;line-height:1.3;}
.opt .t b{display:block;font-weight:300;font-size:23px;color:var(--muted);margin-top:3px;}
.opt .p{font-family:'Montserrat',sans-serif;font-weight:900;font-size:52px;color:#0b0f11;
  background:linear-gradient(135deg,var(--green),var(--gold));padding:10px 26px;border-radius:16px;white-space:nowrap;}

/* Dips zweispaltig */

/* ---------- Seitenanzeige ---------- */
#pager{flex:none;height:56px;display:flex;align-items:center;justify-content:center;gap:14px;}
#pager i{width:150px;height:9px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;display:block;}
#pager i b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold));}
#pager i.on b{animation:fill var(--ms) linear forwards;}
@keyframes fill{from{width:0;}to{width:100%;}}
</style>
</head>
<body>
<div id="board">

  <header>
    <div class="mark">☘</div>
    <div class="brand">
      <h1>KLEEFOOD</h1>
      <p>Burger • Pizza • Fingerfood</p>
    </div>
    <div class="hours">
      <div class="a">TÄGLICH 11:00 – 23:00 UHR</div>
      <div class="b">TEL. 0511 569 575 67 · Kirchröder Str. 77, Hannover</div>
    </div>
  </header>

  <div id="ticker"><div class="tr" id="tr"></div></div>

  <div id="pages"></div>
  <div id="pager"></div>
</div>

<script>
/* =======================================================================
   INHALTE – zweite Hälfte der KLEEFOOD-Karte.
   Burger, Smash Burger und Pizza laufen auf Screen 1.
   ======================================================================= */
const PAGE_MS = 18000;   // Anzeigedauer je Seite

const TICKER = "🔥 TÄGLICH FRISCH • HAUSGEMACHTE SAUCEN • BURGER & PIZZA AUF DEM ANDEREN SCREEN • SPAR MENÜ 12,90 € 🔥";

const PAGES = [
  /* ---------------- Seite 1: Fingerfood, Beilagen, Vegetarisch ---------------- */
  [
    [ { ico:"🍗", title:"FINGERFOOD", sizes:["klein","groß"], items:[
        {no:"45", nm:"Zwiebelringe",      ig:"10 St. mit einem Dip",      pr:"–",    pr2:"4,50"},
        {no:"46", nm:"Mozzarella-Sticks", ig:"5 / 10 St. mit einem Dip",  pr:"4,00", pr2:"7,00"},
        {no:"47", nm:"Hot Chicken Wings", ig:"6 / 10 St. mit einem Dip",  pr:"6,40", pr2:"8,90", best:true},
        {no:"48", nm:"Chicken Nuggets",   ig:"mit Pommes & einem Dip",    pr:"8,00", pr2:"10,00"},
        {no:"49", nm:"Chicken Fingers",   ig:"6 / 10 St. mit einem Dip",  pr:"8,00", pr2:"12,00"},
        {no:"50", nm:"Tex-Mex-Teller",    ig:"je 2× + Pommes & Dips", pr:"", pr2:"9,60"},
        {no:"51", nm:"KLEEFOOD Bucket",   ig:"je 4× plus Pommes & Dips",  pr:"",     pr2:"14,50", best:true}
      ]} ],

    [ { ico:"🍟", title:"BEILAGEN", items:[
        {no:"25", nm:"BBQ Fries",          ig:"BBQ-Sauce, Bacon, Röstzwiebeln",  pr:"5,50"},
        {no:"26", nm:"Chili Cheese Fries", ig:"Jalapeños, Käse",                 pr:"5,50", best:true},
        {no:"27", nm:"Garlic Fries",       ig:"Parmesan, Petersilie, Knoblauch", pr:"5,50"},
        {no:"28", nm:"Süßkartoffel-Pommes",ig:"",                                pr:"4,90", veg:true},
        {no:"29", nm:"Pommes Fries",       ig:"",                                pr:"4,00", veg:true},
        {no:"30", nm:"Curly Fries",        ig:"",                                pr:"5,00", veg:true},
        {no:"31", nm:"Coleslaw",           ig:"Krautsalat",                      pr:"2,50", veg:true}
      ]} ],

    [ { ico:"🥙", title:"VEGETARISCH", items:[
        {no:"35", nm:"Falafel Rolle",      ig:"4 St. mit Salat & Soße",     pr:"5,50",  veg:true},
        {no:"36", nm:"XL Falafel Rolle",   ig:"6 St. mit Salat & Soße",     pr:"6,50",  veg:true},
        {no:"37", nm:"Falafel Teller",     ig:"8 St., Reis oder Pommes",    pr:"10,00", veg:true},
        {no:"38", nm:"Halloumi & Falafel", ig:"3 Halloumi, 3 Falafel",      pr:"8,50",  veg:true},
        {no:"39", nm:"Crispy Teller",      ig:"4 St. mit Reis oder Pommes", pr:"10,00"}
      ]},
      { ico:"🥤", title:"GETRÄNKE", items:[
        {no:"", nm:"Softdrink 0,33 l", ig:"Cola, Fanta, Sprite und mehr", pr:"2,90"}
      ]} ]
  ],

  /* ---------------- Seite 2: Dips & Spar Menü ---------------- */
  [
    [ { ico:"🥣", title:"DIPS & SAUCEN", items:[
        {no:"55", nm:"Ketchup",           pr:"0,50"},
        {no:"56", nm:"Mayonnaise",        pr:"0,50"},
        {no:"57", nm:"Aioli",             pr:"1,00"},
        {no:"58", nm:"Sauer-Creme-Sauce", pr:"1,00"},
        {no:"59", nm:"Juppi-Sauce",       pr:"1,00"},
        {no:"60", nm:"Hanim Master",      pr:"1,00"},
        {no:"61", nm:"Barbecue-Sauce",    pr:"1,00"},
        {no:"62", nm:"Trüffel-Mayonnaise",pr:"1,00"},
        {no:"63", nm:"Käsesauce",         pr:"2,50"}
      ]} ],
    { deal:true }
  ]
];

const DEAL = {
  kick:"SPAR MENÜ",
  sub:"Mach dein Gericht zum Menü – täglich 11:00 – 23:00 Uhr, auch zum Mitnehmen",
  price:"12,90 €",
  opts:[
    {n:"1", t:"Burger nach Wahl",       b:"+ Pommes + 0,33 l Softdrink"},
    {n:"2", t:"2× Smash Burger n. Wahl",b:"+ Pommes + 0,33 l Softdrink"},
    {n:"3", t:"Falafel Rolle",          b:"+ Pommes + 0,33 l Softdrink"}
  ]
};

/* ---------- Ticker ---------- */
document.getElementById('tr').innerHTML = '<span>' + TICKER + '</span><span>' + TICKER + '</span>';

/* ---------- Aufbau ---------- */
function renderRow(it,i){
  return '<div class="row' + (it.best ? ' best' : '') + '" style="--i:' + i + '">' +
           '<div class="no">' + (it.no || '') + '</div>' +
           '<div class="tx"><div class="nm">' + it.nm +
             (it.best ? '<span class="tag b">★ TOP</span>' : '') +
             (it.veg  ? '<span class="tag v">VEGGIE</span>' : '') +
           '</div>' + (it.ig ? '<div class="ig">' + it.ig + '</div>' : '') + '</div>' +
           '<div class="pr">' + it.pr + '</div>' +
           (it.pr2 !== undefined ? '<div class="pr two">' + it.pr2 + '</div>' : '') +
         '</div>';
}

function renderSection(sec){
  const sizes = sec.sizes ? '<div class="sizes">' + sec.sizes.map(s => '<span>' + s + '</span>').join('') + '</div>' : '';
  const rows = sec.items.map(renderRow).join('');
  return '<div class="sec">' +
           '<div class="head"><span class="ico">' + sec.ico + '</span><h2>' + sec.title + '</h2>' + sizes + '</div>' +
           rows +
         '</div>';
}

function renderDeal(){
  return '<div class="deal">' +
           '<div><div class="kick">' + DEAL.kick + '</div><div class="sub">' + DEAL.sub + '</div></div>' +
           DEAL.opts.map((o,i) =>
             '<div class="opt" style="--i:' + i + '">' +
               '<div class="n">' + o.n + '</div>' +
               '<div class="t">' + o.t + '<b>' + o.b + '</b></div>' +
               '<div class="p">' + DEAL.price + '</div>' +
             '</div>').join('') +
         '</div>';
}

const pagesBox = document.getElementById('pages');
const pager = document.getElementById('pager');

PAGES.forEach(cols => {
  const page = document.createElement('div');
  page.className = 'page';
  page.innerHTML = cols.map((c,ci) => {
    if (c.deal) return '<div class="col wide" style="--c:' + ci + '">' + renderDeal() + '</div>';
    return '<div class="col" style="--c:' + ci + '">' + c.map(renderSection).join('') + '</div>';
  }).join('');
  pagesBox.appendChild(page);
  pager.innerHTML += '<i><b></b></i>';
});

const pageEls = [...pagesBox.children], dotEls = [...pager.children];
dotEls.forEach(d => d.style.setProperty('--ms', PAGE_MS + 'ms'));

let p = -1;
function showPage(i){
  p = i % pageEls.length;
  pageEls.forEach((el,n) => {
    if (n === p){ el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); }
    else el.classList.remove('on');
  });
  dotEls.forEach((el,n) => { el.classList.remove('on'); if (n === p){ void el.offsetWidth; el.classList.add('on'); } });
}
showPage(0);
setInterval(() => showPage(p + 1), PAGE_MS);

/* ---------- Auto-Skalierung ---------- */
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  document.body.style.transform = 'scale(' + s + ')';
}
addEventListener('resize', fit); fit();
</script>
</body>
</html>
