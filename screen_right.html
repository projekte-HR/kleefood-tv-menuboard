<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KLEEFOOD – Screen 2 – Fingerfood, Beilagen & Deals</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800;900&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
/* =======================================================================
   KLEEFOOD – SCREEN 2 (1920x1080)
   Zweite Hälfte der Karte, alles gleichzeitig sichtbar, nichts wechselt:
     links   Fingerfood + Vegetarisch
     Mitte   Beilagen + Getränke + echtes Foto
     rechts  Dips & Saucen + Spar Menü
   Burger, Smash Burger und Pizza laufen auf Screen 1.
   Fire TV Stick: nur transform / opacity / clip-path, keine Filter.
   ======================================================================= */

:root{
  --bg:#111417; --green:#00E676; --gold:#FF9F1C;
  --white:#fff; --muted:rgba(255,255,255,.64); --line:rgba(255,255,255,.09);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--white);
  font-family:'Poppins',system-ui,sans-serif;transform-origin:top left;
}
#board{
  position:relative;width:1920px;height:1080px;padding:18px 34px 0;display:flex;flex-direction:column;
  background:
    radial-gradient(56% 42% at 16% 2%,  rgba(0,230,118,.14), transparent 62%),
    radial-gradient(50% 40% at 92% 98%, rgba(255,159,28,.12), transparent 62%);
}

/* ---------- Kopf ---------- */
header{display:flex;align-items:center;gap:20px;flex:none;height:86px;}
.mark{width:70px;height:70px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:38px;
  border:3px solid var(--green);background:rgba(0,230,118,.08);box-shadow:0 0 28px rgba(0,230,118,.22) inset;}
.brand h1{font-family:'Bebas Neue',sans-serif;font-size:62px;line-height:.88;letter-spacing:5px;
  background:linear-gradient(92deg,var(--white),var(--green) 55%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.brand p{font-size:17px;letter-spacing:6px;text-transform:uppercase;color:var(--muted);margin-top:3px;}
.hours{margin-left:auto;text-align:right;font-family:'Montserrat',sans-serif;}
.hours .a{font-size:25px;font-weight:900;letter-spacing:2px;color:var(--gold);}
.hours .b{font-size:18px;font-weight:800;margin-top:4px;color:var(--muted);}

/* ---------- Raster ---------- */
#grid{flex:1;min-height:0;display:grid;grid-template-columns:1.08fr 1fr .96fr;gap:20px;margin-top:8px;}
.col{display:flex;flex-direction:column;gap:16px;min-height:0;}
.card{
  background:linear-gradient(180deg,rgba(23,28,32,.94),rgba(17,20,23,.94));
  border:1.5px solid var(--line);border-radius:20px;padding:14px 18px;
  display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0;
}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--green),var(--gold));}
.play .card{animation:cardIn .7s cubic-bezier(.22,1,.36,1) calc(var(--c)*.1s) both;}
@keyframes cardIn{from{opacity:0;transform:translateY(34px);} to{opacity:1;transform:none;}}

/* ---------- Foto ---------- */
.shot{position:relative;flex:1;min-height:120px;border-radius:20px;overflow:hidden;border:1.5px solid var(--line);}
.shot .img{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.02);}
.play .shot .img{animation:ken 26s ease-in-out infinite alternate;}
@keyframes ken{from{transform:scale(1.02);} to{transform:scale(1.16);}}
.shot::after{content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(10,12,14,.92) 0%,rgba(10,12,14,.12) 46%,transparent 70%);}
.shot .cap{position:absolute;left:18px;right:18px;bottom:14px;z-index:2;display:flex;align-items:flex-end;gap:14px;}
.shot .cap .t{font-family:'Bebas Neue',sans-serif;font-size:38px;line-height:1;letter-spacing:2px;}
.shot .cap .t b{display:block;font-family:'Poppins';font-weight:300;font-size:16px;color:var(--muted);letter-spacing:0;}
.shot .cap .p{margin-left:auto;font-family:'Montserrat',sans-serif;font-weight:900;font-size:29px;
  color:#0b0f11;background:linear-gradient(135deg,var(--green),var(--gold));padding:6px 18px;border-radius:12px;white-space:nowrap;}
.play .shot .cap{animation:cardIn .7s cubic-bezier(.22,1,.36,1) .5s both;}

/* ---------- Kategorie-Kopf ---------- */
.head{display:flex;align-items:flex-end;gap:10px;padding-bottom:7px;margin-bottom:4px;
  border-bottom:2px solid rgba(255,255,255,.13);flex:none;}
.sec + .sec .head{margin-top:10px;}
.play .head{animation:wipe .7s cubic-bezier(.22,1,.36,1) calc(.12s + var(--c)*.1s) both;}
@keyframes wipe{from{clip-path:inset(0 100% 0 0);} to{clip-path:inset(0 0 0 0);}}
.head .ico{font-size:31px;line-height:1;}
.head h2{font-family:'Bebas Neue',sans-serif;font-size:46px;letter-spacing:2.5px;line-height:1;
  background:linear-gradient(90deg,var(--white),var(--green));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.head .sizes{margin-left:auto;display:flex;gap:12px;}
.head .sizes span{width:84px;text-align:right;font-size:14px;font-weight:800;color:var(--gold);
  font-family:'Montserrat',sans-serif;letter-spacing:1px;text-transform:uppercase;}

/* ---------- Zeile ---------- */
.row{display:flex;align-items:center;gap:10px;padding:3px 5px;border-radius:9px;position:relative;}
.row + .row{border-top:1px solid rgba(255,255,255,.06);}
.play .row{animation:rowIn .5s cubic-bezier(.22,1,.36,1) calc(.25s + var(--c)*.1s + var(--i)*.045s) both;}
@keyframes rowIn{from{opacity:0;transform:translateY(26px);} to{opacity:1;transform:none;}}
.row .no{font-family:'Montserrat',sans-serif;font-weight:900;font-size:18px;color:var(--gold);width:30px;flex:none;}
.row .tx{flex:1;min-width:0;}
.row .nm{font-size:28px;font-weight:600;line-height:1.16;}
.row .ig{font-size:17px;font-weight:300;color:var(--muted);line-height:1.2;margin-top:1px;}
.row .pr{font-family:'Montserrat',sans-serif;font-weight:900;font-size:30px;color:var(--gold);
  width:84px;text-align:right;flex:none;white-space:nowrap;}
.row .pr.two{color:var(--white);}
.play .row .pr{animation:pop .45s cubic-bezier(.34,1.56,.64,1) calc(.4s + var(--c)*.1s + var(--i)*.045s) both;}
@keyframes pop{0%{opacity:0;transform:scale(.65);}60%{opacity:1;transform:scale(1.16);}100%{transform:scale(1);}}

.row.best{background:rgba(0,230,118,.09);box-shadow:inset 0 0 0 1.5px rgba(0,230,118,.32);}
.play .row.best{animation:rowIn .5s cubic-bezier(.22,1,.36,1) calc(.25s + var(--c)*.1s + var(--i)*.045s) both,
                          beat 7s ease-in-out 2s infinite;}
@keyframes beat{0%,88%,100%{transform:scale(1);}94%{transform:scale(1.03);}}
.tag{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:900;letter-spacing:1.1px;
  padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle;white-space:nowrap;}
.tag.b{background:var(--green);color:#0b0f11;}
.tag.v{border:1px solid var(--green);color:var(--green);}

/* ---------- Spar Menü ---------- */
#deal{
  flex:none;border-radius:20px;padding:16px 20px;border:2px solid var(--gold);
  background:linear-gradient(135deg,rgba(0,230,118,.16),rgba(255,159,28,.16));
  box-shadow:0 0 30px rgba(255,159,28,.20);
}
.play #deal{animation:cardIn .7s cubic-bezier(.22,1,.36,1) .5s both;}
#deal .top{display:flex;align-items:center;gap:14px;}
#deal .kick{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:3px;color:var(--gold);line-height:1;}
#deal .price{margin-left:auto;font-family:'Montserrat',sans-serif;font-weight:900;font-size:38px;color:#0b0f11;
  background:linear-gradient(135deg,var(--green),var(--gold));padding:8px 22px;border-radius:14px;white-space:nowrap;}
#deal ul{list-style:none;margin-top:10px;}
#deal li{font-size:23px;font-weight:500;line-height:1.55;}
#deal li::before{content:"▸ ";color:var(--green);font-weight:900;}
#deal .note{font-size:15px;color:var(--muted);margin-top:6px;}

/* ---------- Ticker ---------- */
footer{flex:none;height:66px;display:flex;align-items:center;padding:10px 0;}
#ticker{flex:1;height:46px;border-radius:11px;overflow:hidden;display:flex;align-items:center;
  border:1.5px solid rgba(0,230,118,.28);background:rgba(0,230,118,.06);}
#ticker .tr{display:flex;white-space:nowrap;animation:scroll 38s linear infinite;}
#ticker .tr span{font-family:'Montserrat',sans-serif;font-weight:900;font-size:21px;letter-spacing:4px;
  padding:0 52px;text-transform:uppercase;}
@keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
</style>
</head>
<body>
<div id="board" class="play">

  <header>
    <div class="mark">☘</div>
    <div class="brand">
      <h1>KLEEFOOD</h1>
      <p>Burger • Pizza • Fingerfood</p>
    </div>
    <div class="hours">
      <div class="a">TÄGLICH 11:00 – 23:00 UHR</div>
      <div class="b">TEL. 0511 569 575 67 · Kirchröder Str. 77, Hannover</div>
    </div>
  </header>

  <div id="grid">
    <div class="col" style="--c:0"><div class="card" id="c1"></div></div>

    <div class="col" style="--c:1">
      <div class="card" id="c2"></div>
      <div class="shot">
        <div class="img" id="imgFries"></div>
        <div class="cap">
          <div class="t">CHILI CHEESE FRIES<b>Knusprige Fries mit Jalapeños und Käse</b></div>
          <div class="p">5,50 €</div>
        </div>
      </div>
    </div>

    <div class="col" style="--c:2">
      <div class="card" id="c3"></div>
      <div id="deal"></div>
    </div>
  </div>

  <footer><div id="ticker"><div class="tr" id="tr"></div></div></footer>
</div>

<script>
/* =======================================================================
   INHALTE – zweite Hälfte der KLEEFOOD-Karte.
   Eigenes Foto? URL in PHOTO auf z. B. "fotos/fries.jpg" ändern.
   ======================================================================= */
const PHOTO = "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=1000&q=72";

const TICKER = "🔥 TÄGLICH FRISCH • HAUSGEMACHTE SAUCEN • BURGER & PIZZA AUF DEM ANDEREN SCREEN • SPAR MENÜ 12,90 € 🔥";

const S = {
  finger: { ico:"🍗", title:"FINGERFOOD", sizes:["klein","groß"], items:[
    {no:"45", nm:"Zwiebelringe",      ig:"10 St. mit einem Dip",       pr:"–",    pr2:"4,50"},
    {no:"46", nm:"Mozzarella-Sticks", ig:"5 / 10 St. mit einem Dip",   pr:"4,00", pr2:"7,00"},
    {no:"47", nm:"Hot Chicken Wings", ig:"6 / 10 St. mit einem Dip",   pr:"6,40", pr2:"8,90", best:true},
    {no:"48", nm:"Chicken Nuggets",   ig:"mit Pommes & einem Dip",     pr:"8,00", pr2:"10,00"},
    {no:"49", nm:"Chicken Fingers",   ig:"6 / 10 St. mit einem Dip",   pr:"8,00", pr2:"12,00"},
    {no:"50", nm:"Tex-Mex-Teller",    ig:"je 2× plus Pommes & 2 Dips", pr:"", pr2:"9,60"},
    {no:"51", nm:"KLEEFOOD Bucket",   ig:"je 4× plus Pommes & 4 Dips", pr:"",     pr2:"14,50", best:true}
  ]},

  veg: { ico:"🥙", title:"VEGETARISCH", items:[
    {no:"35", nm:"Falafel Rolle",       ig:"4 St. mit Salat & Soße",              pr:"5,50",  veg:true},
    {no:"36", nm:"XL Falafel Rolle",    ig:"6 St. mit Salat & Soße",              pr:"6,50",  veg:true},
    {no:"37", nm:"Falafel Teller",      ig:"8 St., Reis oder Pommes, Salat & Soße",pr:"10,00", veg:true},
    {no:"38", nm:"Halloumi & Falafel",  ig:"3 Halloumi, 3 Falafel",               pr:"8,50",  veg:true},
    {no:"39", nm:"Crispy Teller",       ig:"4 St. mit Reis oder Pommes",          pr:"10,00"}
  ]},

  beilagen: { ico:"🍟", title:"BEILAGEN", items:[
    {no:"25", nm:"BBQ Fries",           ig:"BBQ-Sauce, Bacon, Röstzwiebeln",   pr:"5,50"},
    {no:"26", nm:"Chili Cheese Fries",  ig:"Jalapeños, Käse",                  pr:"5,50", best:true},
    {no:"27", nm:"Garlic Fries",        ig:"Parmesan, Petersilie, Knoblauch",  pr:"5,50"},
    {no:"28", nm:"Süßkartoffel-Pommes", ig:"",                                 pr:"4,90", veg:true},
    {no:"29", nm:"Pommes Fries",        ig:"",                                 pr:"4,00", veg:true},
    {no:"30", nm:"Curly Fries",         ig:"",                                 pr:"5,00", veg:true},
    {no:"31", nm:"Coleslaw",            ig:"Krautsalat",                       pr:"2,50", veg:true}
  ]},

  drinks: { ico:"🥤", title:"GETRÄNKE", items:[
    {no:"", nm:"Softdrink 0,33 l", ig:"Cola, Fanta, Sprite und mehr", pr:"2,90"}
  ]},

  dips: { ico:"🥣", title:"DIPS & SAUCEN", items:[
    {no:"55", nm:"Ketchup",            pr:"0,50"},
    {no:"56", nm:"Mayonnaise",         pr:"0,50"},
    {no:"57", nm:"Aioli",              pr:"1,00"},
    {no:"58", nm:"Sauer-Creme-Sauce",  pr:"1,00"},
    {no:"59", nm:"Juppi-Sauce",        pr:"1,00"},
    {no:"60", nm:"Hanim Master Sauce", pr:"1,00"},
    {no:"61", nm:"Barbecue-Sauce",     pr:"1,00"},
    {no:"62", nm:"Trüffel-Mayonnaise", pr:"1,00"},
    {no:"63", nm:"Käsesauce",          pr:"2,50"}
  ]}
};

const DEAL = {
  kick:"SPAR MENÜ", price:"12,90 €",
  lines:[
    "Burger nach Wahl + Pommes + 0,33 l Softdrink",
    "2× Smash Burger nach Wahl + Pommes + 0,33 l Softdrink",
    "Falafel Rolle + Pommes + 0,33 l Softdrink"
  ],
  note:"Täglich 11:00 – 23:00 Uhr · auch zum Mitnehmen"
};

/* ---------- Aufbau ---------- */
document.getElementById('imgFries').style.backgroundImage = 'url(' + PHOTO + ')';
document.getElementById('tr').innerHTML = '<span>' + TICKER + '</span><span>' + TICKER + '</span>';

function renderSection(sec){
  const sizes = sec.sizes ? '<div class="sizes">' + sec.sizes.map(s => '<span>' + s + '</span>').join('') + '</div>' : '';
  const rows = sec.items.map((it,i) =>
    '<div class="row' + (it.best ? ' best' : '') + '" style="--i:' + i + '">' +
      '<div class="no">' + (it.no || '') + '</div>' +
      '<div class="tx"><div class="nm">' + it.nm +
        (it.best ? '<span class="tag b">★ TOP</span>' : '') +
        (it.veg  ? '<span class="tag v">VEGGIE</span>' : '') +
      '</div>' + (it.ig ? '<div class="ig">' + it.ig + '</div>' : '') + '</div>' +
      '<div class="pr">' + it.pr + '</div>' +
      (it.pr2 !== undefined ? '<div class="pr two">' + it.pr2 + '</div>' : '') +
    '</div>').join('');
  return '<div class="sec"><div class="head"><span class="ico">' + sec.ico + '</span><h2>' + sec.title + '</h2>' +
         sizes + '</div>' + rows + '</div>';
}

document.getElementById('c1').innerHTML = renderSection(S.finger) + renderSection(S.veg);
document.getElementById('c2').innerHTML = renderSection(S.beilagen) + renderSection(S.drinks);
document.getElementById('c3').innerHTML = renderSection(S.dips);
document.getElementById('deal').innerHTML =
  '<div class="top"><span class="kick">' + DEAL.kick + '</span><span class="price">' + DEAL.price + '</span></div>' +
  '<ul>' + DEAL.lines.map(l => '<li>' + l + '</li>').join('') + '</ul>' +
  '<div class="note">' + DEAL.note + '</div>';

/* ---------- Einblendungen alle 60 s neu starten ---------- */
const board = document.getElementById('board');
setInterval(() => {
  board.classList.remove('play');
  void board.offsetWidth;
  board.classList.add('play');
}, 60000);

/* ---------- Auto-Skalierung ---------- */
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  document.body.style.transform = 'scale(' + s + ')';
}
addEventListener('resize', fit); fit();
</script>
</body>
</html>
