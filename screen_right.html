<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KLEEFOOD – Screen 2 – Pizza & Veggie</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800;900&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
</head>
<body>

<!-- SCREEN 2 (1920x1080) – Seite 2 des Aufstellers
     Spalte 1  Pizza 65–73
     Spalte 2  Pizza 74–82 · Vegetarisch
     Spalte 3  Fingerfood · Dips
     Inhalte und Preise stehen in menu.js, das Design in board.css        -->

<div id="stage" class="quer">
  <div id="wolken"></div>

  <header>
    <img class="logo" src="logo.jpg" alt="KleeFood">
    <div class="marke">
      <h1>KLEE<em>FOOD</em></h1>
      <p>Burger · Pizza · Fingerfood</p>
    </div>
    <div class="kopf-rechts">
      <div class="gross">PIZZA <em>& VEGGIE</em></div>
      <div class="klein" id="tel"></div>
    </div>
  </header>

  <div id="raster">
    <div class="spalte" style="--c:0;flex:1 1 0%"><div class="karte" id="s1"></div></div>
    <div class="spalte" style="--c:1;flex:1 1 0%"><div class="karte" id="s2"></div></div>
    <div class="spalte" style="--c:2;flex:1 1 0%" id="s3"></div>
  </div>

  <footer><div id="laufband"></div></footer>
</div>

<script src="menu.js"></script>
<script src="board.js"></script>
<script>
document.getElementById('tel').textContent = TELEFON;

document.getElementById('s1').innerHTML = block(MENU.pizzaA);
document.getElementById('s2').innerHTML = block(MENU.pizzaB) + block(MENU.vegetarisch);
document.getElementById('s3').innerHTML =
  '<div class="karte">' + block(MENU.fingerfood) + '</div>' +
  '<div class="karte">' + dipBlock(MENU.dips) + '</div>';

document.getElementById('laufband').innerHTML = laufband(TICKER.rechts);

starten();
</script>
</body>
</html>
