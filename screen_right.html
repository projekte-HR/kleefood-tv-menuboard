<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KLEEFOOD – Screen 2 – Pizza &amp; Veggie</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800;900&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
</head>
<body>

<!-- SCREEN 2 (1920x1080) – Pizza, Fingerfood, Vegetarisch, Dips
     Magazin-Aufbau: links ein großes Foto, rechts die Liste in zwei Spalten.
     Dieser Screen läuft für sich, unabhängig von den anderen beiden.
     Inhalte und Preise stehen in menu.js, das Aussehen in board.css       -->

<div id="stage" class="quer">
  <div id="glut"></div>
  <div id="streifen"></div>

  <header>
    <img class="logo" src="logo.jpg" alt="KleeFood">
    <div class="marke">
      <h1>KLEE<em>FOOD</em></h1>
      <p>Burger · Pizza · Fingerfood</p>
    </div>
    <div class="kopf-rechts">
      <div class="gross">PIZZA &amp; VEGGIE</div>
      <div class="klein" id="tel"></div>
    </div>
  </header>
  <div class="kopflinie"><i></i></div>

  <div id="seiten"></div>
  <div id="punkte"></div>

  <footer><div id="laufband"></div></footer>
</div>

<script>var SEITE_S = 15;</script>
<script src="menu.js"></script>
<script src="board.js"></script>
<script>
document.getElementById('tel').textContent = TELEFON;
document.getElementById('laufband').innerHTML = laufband(TICKER.rechts);

starten([
  /* Seite 1 – Pizza 65 bis 73 */
  seite(foto('fotos/menu4.jpg', 'PIZZA', 'Steinofen · 30 cm & 40 cm', 'ab 7,50 €'),
        block(MENU.pizzaA)),

  /* Seite 2 – Pizza 74 bis 82 */
  seite(foto('fotos/hero.jpg', 'PIZZA SPEZIAL', 'Reichlich belegt · 30 cm & 40 cm', 'ab 7,50 €'),
        block(MENU.pizzaB)),

  /* Seite 3 – Fingerfood */
  seite(foto('fotos/menu3.jpg', 'FINGERFOOD', 'Klein oder groß · zum Teilen', 'ab 5,00 €'),
        block(MENU.fingerfood)),

  /* Seite 4 – Vegetarisch und die Dips */
  seite(foto('fotos/menu2.jpg', 'VEGETARISCH', 'Falafel, Halloumi & mehr', 'ab 6,50 €'),
        blockEinspaltig(MENU.vegetarisch) + dipBlock(MENU.dips))
]);
</script>
</body>
</html>
