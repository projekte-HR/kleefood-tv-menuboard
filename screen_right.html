<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KLEEFOOD – Screen 2 – Pizza & Veggie</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800;900&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
</head>
<body>

<!-- SCREEN 2 (1920x1080) – Pizza & Veggie, vier Seiten im Gleichtakt
     Die Lichtwelle erreicht diesen Screen 0,6 s nach Screen 1.
     Inhalte und Preise stehen in menu.js, das Design in board.css        -->

<div id="stage" class="quer">
  <div id="gitter"></div>
  <div id="welle"></div>

  <header>
    <img class="logo" src="logo.jpg" alt="KleeFood">
    <div class="marke">
      <h1>KLEE<em>FOOD</em></h1>
      <p>Burger · Pizza · Fingerfood</p>
    </div>
    <div class="kopf-rechts">
      <div class="gross">PIZZA &amp; VEGGIE</div>
      <div class="klein" id="tel"></div>
    </div>
  </header>

  <div id="seiten"></div>
  <div id="punkte"></div>

  <footer><div id="laufband"></div></footer>
</div>

<script>var SCREEN = 2;</script>
<script src="menu.js"></script>
<script src="board.js"></script>
<script>
document.getElementById('tel').textContent = TELEFON;
document.getElementById('laufband').innerHTML = laufband(TICKER.rechts);

starten([
  /* Seite 1 – Pizza 65 bis 73 */
  tafel(block(MENU.pizzaA)),

  /* Seite 2 – Pizza 74 bis 82 */
  tafel(block(MENU.pizzaB)),

  /* Seite 3 – Fingerfood */
  tafel(block(MENU.fingerfood)),

  /* Seite 4 – Vegetarisch und Dips */
  tafel(block(MENU.vegetarisch)) +
  tafel(dipBlock(MENU.dips))
]);
</script>
</body>
</html>
