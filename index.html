<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:grid;place-items:center;background:#111417;color:#fff;
       font-family:'Poppins',sans-serif;padding:40px;
       background-image:radial-gradient(60% 50% at 20% 0%,rgba(0,230,118,.18),transparent 65%),

  p{text-align:center;color:rgba(255,255,255,.6);letter-spacing:3px;text-transform:uppercase;font-size:14px;margin-top:6px}
  .links{display:flex;gap:24px;margin-top:44px;flex-wrap:wrap;justify-content:center}

    border:2px solid rgba(0,230,118,.45);background:rgba(23,28,32,.8);transition:.3s}
  a:hover{transform:translateY(-6px);border-color:#00E676;box-shadow:0 0 40px rgba(0,230,118,.35)}
  a b{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:3px;display:block}
  a span{font-size:14px;color:rgba(255,255,255,.6)}
  .hint{margin-top:38px;font-size:13px;color:rgba(255,255,255,.45);text-align:center;text-transform:none;letter-spacing:0}
