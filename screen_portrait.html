<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KLEEFOOD – Screen 3 – Gerichte (Hochformat)</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800;900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
<style>
/* =======================================================================
   KLEEFOOD – SCREEN 3: GERICHTE IM HOCHFORMAT (1080x1920)
   Für einen um 90° gedrehten TV. Optimiert für Fire TV Stick:
   - immer nur EIN Video gleichzeitig aktiv
   - keine Blend-Modes, keine CSS-Filter, keine Partikel (fressen Leistung)
   - Videos in 360p (Umschalten über RES weiter unten)
   Querformat-Signal -> Bühne dreht sich automatisch. Taste "R" = Richtung.
   ======================================================================= */

:root{ --bg:#111417; --green:#00E676; --gold:#FF9F1C; --white:#fff; --muted:rgba(255,255,255,.72); }
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}

#stage{
  position:absolute;top:50%;left:50%;
  width:1080px;height:1920px;margin:-960px 0 0 -540px;
  transform-origin:center center;background:var(--bg);overflow:hidden;
  font-family:'Poppins',system-ui,sans-serif;color:var(--white);
}

/* ---------- 1. Gericht-Video ---------- */
/* Zwei Player: der nächste Clip wird im Hintergrund geladen und eingeblendet.
   Dadurch gibt es beim Wechsel keinen schwarzen Moment mehr. */
.player{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;
  opacity:0;transition:opacity .5s linear;
}
.player.on{opacity:1;z-index:2;}

/* Abdunklung oben/unten für die Texte */
#scrim{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(17,20,23,.92) 0%,rgba(17,20,23,.20) 24%,
                                    rgba(17,20,23,.10) 50%,rgba(17,20,23,.95) 86%);
}

/* ---------- 2. Übergangs-Video: deckt den Screen komplett ab ---------- */
#trans{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  z-index:9;opacity:0;transition:opacity .25s linear;pointer-events:none;
  /* "screen" blendet das Schwarz des Clips weg – es bleibt nur Rauch/Feuer/Funken
     sichtbar, das Gericht dahinter verschwindet nie in einem schwarzen Bild. */
  mix-blend-mode:screen;
}
#trans.on{opacity:1;}

/* ---------- 3. Kopfbereich ---------- */
#top{position:absolute;top:0;left:0;right:0;z-index:8;padding:74px 70px 0;text-align:center;}
#logo{
  font-family:'Bebas Neue',sans-serif;font-size:106px;letter-spacing:9px;line-height:1;color:var(--green);
  text-shadow:0 0 30px rgba(0,230,118,.45);   /* statisch = günstig für den Stick */
}
#claim{margin-top:12px;font-size:25px;letter-spacing:9px;text-transform:uppercase;color:var(--muted);}

/* ---------- 4. Gericht-Text unten ---------- */
#bottom{position:absolute;left:0;right:0;bottom:0;z-index:8;padding:0 70px 78px;}

.reveal{opacity:0;transform:translateY(40px);}
#bottom.play .reveal{animation:up .7s ease-out forwards;}
@keyframes up{to{opacity:1;transform:translateY(0);}}

#cat{
  display:inline-block;font-family:'Montserrat',sans-serif;font-weight:900;font-size:22px;
  letter-spacing:5px;color:#0b0f11;background:var(--green);padding:10px 26px;border-radius:999px;
  animation-delay:.05s;
}
#head{
  margin-top:22px;font-family:'Bebas Neue',sans-serif;font-size:124px;line-height:.95;letter-spacing:2px;
  color:var(--white);animation-delay:.15s;
}
#sub{margin-top:18px;font-size:33px;font-weight:300;line-height:1.4;color:var(--muted);animation-delay:.25s;}

#price{
  display:inline-block;margin-top:30px;font-family:'Montserrat',sans-serif;font-weight:900;font-size:78px;
  color:#0b0f11;background:var(--gold);padding:14px 44px;border-radius:22px;animation-delay:.35s;
}

/* Fortschrittsbalken je Gericht */
#dots{display:flex;gap:12px;margin-top:40px;}
.dot-i{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;}
.dot-i i{display:block;height:100%;width:0;background:var(--green);}
.dot-i.done i{width:100%;}
.dot-i.now i{animation:grow linear forwards;}
@keyframes grow{from{width:0}to{width:100%}}

#foot{
  margin-top:34px;border-top:1.5px solid rgba(255,255,255,.12);padding-top:24px;
  font-family:'Montserrat',sans-serif;font-size:22px;font-weight:800;color:var(--muted);letter-spacing:1px;
}
#foot b{color:var(--white);}
</style>
</head>
<body>

<div id="stage">
  <video id="pA" class="player" muted playsinline preload="auto" loop></video>
  <video id="pB" class="player" muted playsinline preload="auto" loop></video>
  <div id="scrim"></div>

  <div id="top">
    <div id="logo">KLEEFOOD</div>
    <div id="claim">Burger • Pizza • Fingerfood</div>
  </div>

  <div id="bottom">
    <span id="cat"  class="reveal"></span>
    <h1   id="head" class="reveal"></h1>
    <p    id="sub"  class="reveal"></p>
    <div><span id="price" class="reveal"></span></div>
    <div id="dots"></div>
    <div id="foot"><b>TÄGLICH 11:00 – 23:00 UHR</b> · Kirchröder Str. 77, Hannover · Tel. 0511 569 575 67</div>
  </div>

  <!-- Übergangs-Video liegt über allem, sein Schwarz wird weggeblendet -->
  <video id="trans" muted playsinline preload="auto"></video>
</div>

<script>
/* =======================================================================
   INHALTE – Gerichte direkt aus der KLEEFOOD-Speisekarte.
   vid  : Mixkit-Video-ID  (eigene Aufnahme? dann stattdessen
          full:"videos/mein-burger.mp4" eintragen)
   secs : Anzeigedauer in Sekunden
   ======================================================================= */
const RES = 360;   // 360 = kleine Dateien (Fire TV Stick) · 720 = schärfer, größer

const DISHES = [
  { cat:"Nr. 04 · Burger", head:"Kleefood<br>BBQ Burger",  sub:"Rindfleisch-Patty, Cheddar-Käse, Bacon, Barbecue-Sauce",
    price:"7,50 €",  vid:12041, secs:10 },
  { cat:"Nr. 13 · Burger", head:"Kleefeld<br>Special",     sub:"2 Mozzarella-Sticks, 2 Zwiebelringe, Röstzwiebeln, Sauce nach Wahl",
    price:"10,00 €", vid:12016, secs:10 },
  { cat:"Nr. 03 · Burger", head:"Chili<br>Cheeseburger",   sub:"Rindfleisch-Patty, Cheddar-Käse, Jalapeños, Chili-Sauce",
    price:"7,00 €",  vid:16599, secs:10 },
  { cat:"Nr. 17 · Smash",  head:"Chili Cheese<br>Smash",   sub:"Smash-Patty mit Käse und Jalapeños · doppeltes Patty +2,50 €",
    price:"5,00 €",  vid:11760, secs:10 },
  { cat:"Nr. 26 · Beilage",head:"Chili<br>Cheese Fries",   sub:"Knusprige Fries mit Jalapeños und Käse",
    price:"5,50 €",  vid:36582, secs:10 },
  { cat:"Spar Menü",       head:"Menü statt<br>nur Burger",sub:"Burger nach Wahl + Pommes + 0,33 l Softdrink",
    price:"12,90 €", vid:14010, secs:10 }
];

/* Übergangs-Video zwischen den Gerichten.
   Andere Varianten (einfach vid/start tauschen):
     50951 / 0.6  Rauch-Wirbel   (aktuell)
      7090 / 1.5  Grill-Glut
     30749 / 0.8  Funkenflug
      3454 / 1.0  Kohle-Feuer
     46316 / 1.0  Gold-Partikel
     18052 / 0.4  Partikel-Explosion
   Alle sechs live vergleichen: uebergaenge.html                          */
const TRANS = { vid:50951, start:0.6, ms:1600 };

const url = (d) => d.full || ('https://assets.mixkit.co/videos/' + d.vid + '/' + d.vid + '-' + RES + '.mp4');

/* ---------- Aufbau ---------- */
let front = document.getElementById('pA');   // läuft gerade
let back  = document.getElementById('pB');   // lädt schon das nächste Gericht
const trans  = document.getElementById('trans');
const bottom = document.getElementById('bottom');
const dots   = document.getElementById('dots');

trans.src = 'https://assets.mixkit.co/videos/' + TRANS.vid + '/' + TRANS.vid + '-360.mp4';
trans.addEventListener('loadeddata', () => { trans.currentTime = TRANS.start; });

DISHES.forEach(() => {
  const d = document.createElement('div');
  d.className = 'dot-i'; d.innerHTML = '<i></i>';
  dots.appendChild(d);
});
const dotEls = [...dots.children];

let idx = -1, timer = null;

function preload(i){                       // nächsten Clip schon mal puffern
  const d = DISHES[(i + DISHES.length) % DISHES.length];
  if (back.src !== url(d)){ back.src = url(d); back.load(); }
}

function show(i){
  idx = (i + DISHES.length) % DISHES.length;
  const d = DISHES[idx];

  playTransition();                        // Übergang läuft – der Wechsel passiert dahinter

  setTimeout(() => {
    if (back.src !== url(d)){ back.src = url(d); }
    back.play().catch(() => {});
    back.classList.add('on');              // einblenden …
    front.classList.remove('on');          // … und den alten Clip ausblenden
    const tmp = front; front = back; back = tmp;
    setTimeout(() => { back.pause(); preload(idx + 1); }, 600);

    bottom.classList.remove('play');
    void bottom.offsetWidth;
    document.getElementById('cat').innerHTML   = d.cat;
    document.getElementById('head').innerHTML  = d.head;
    document.getElementById('sub').textContent = d.sub;
    document.getElementById('price').textContent = d.price;
    bottom.classList.add('play');
  }, TRANS.ms * 0.45);         // Wechsel genau dann, wenn das Video den Screen deckt

  dotEls.forEach((el,n) => {
    el.className = 'dot-i' + (n < idx ? ' done' : n === idx ? ' now' : '');
    el.firstChild.style.animationDuration = d.secs + 's';
  });

  clearTimeout(timer);
  timer = setTimeout(() => show(idx + 1), d.secs * 1000);
}

/* Übergangs-Video nur während des Wechsels abspielen – dazwischen steht es
   still, das spart auf dem Fire TV Stick spürbar Leistung. */
function playTransition(){
  trans.currentTime = TRANS.start;
  trans.play().catch(() => {});
  trans.classList.add('on');
  setTimeout(() => trans.classList.remove('on'), TRANS.ms);
  setTimeout(() => trans.pause(), TRANS.ms + 300);
}

/* ---------- Drehung & Skalierung ----------
   Querformat-Signal -> 90° drehen · Hochformat-Signal -> nur skalieren
   Taste "R" schaltet die Drehrichtung um.                                */
function store(v){ try{ if(v===undefined) return localStorage.getItem('kleefood-rot');
                        localStorage.setItem('kleefood-rot', v); }catch(e){ return null; } }
let dir = +(store() || 90);

function fit(){
  const rot = innerWidth >= innerHeight ? dir : 0;
  const w = rot ? 1920 : 1080, h = rot ? 1080 : 1920;
  const s = Math.min(innerWidth / w, innerHeight / h);
  document.getElementById('stage').style.transform = 'rotate(' + rot + 'deg) scale(' + s + ')';
}
addEventListener('resize', fit);
addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'r'){ dir = dir === 90 ? 270 : 90; store(dir); fit(); }
});
fit();

show(0);
</script>
</body>
</html>
