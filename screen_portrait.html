<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KLEEFOOD – Screen 3 – Spar Menüs</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800;900&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
</head>
<body>

<!-- SCREEN 3 (1080x1920, Hochformat) – die Spar Menüs
     Magazin-Aufbau hochkant: oben das große Foto, darunter die übrigen Menüs.
     Dieser Screen läuft für sich, unabhängig von den anderen beiden.
     Querformat-Signal? Dann dreht sich die Bühne auf 270°, Taste "R" kehrt um.
     Inhalte und Preise stehen in menu.js, das Aussehen in board.css       -->

<div id="stage" class="hoch">
  <div id="glut"></div>
  <div id="streifen"></div>

  <header>
    <img class="logo" src="logo.jpg" alt="KleeFood">
    <div class="marke">
      <h1>KLEE<em>FOOD</em></h1>
      <p>Burger · Pizza · Fingerfood</p>
    </div>
  </header>

  <div class="hochtitel">
    <div class="ab" id="ab"></div>
    <h2>SPAR <em>MENÜS</em></h2>
    <p id="info"></p>
  </div>

  <div id="seiten"></div>
  <div id="punkte"></div>

  <div id="hochfuss">
    <div class="zeile1" id="aktion"></div>
    <div class="tel" id="tel"></div>
  </div>
</div>

<script>var SEITE_S = 11;</script>
<script src="menu.js"></script>
<script src="board.js"></script>
<script>
document.getElementById('ab').textContent   = SPAR.ab.toUpperCase();
document.getElementById('info').textContent = SPAR.info;
document.getElementById('tel').textContent  = TELEFON;
document.getElementById('aktion').innerHTML =
  '<b>' + AKTION.titel + '</b>Pommes ' + AKTION.info + '<span>' + AKTION.preis + '</span>';

/* Je Seite ein Menü groß, die übrigen klein darunter */
starten([
  menueSeite(0),
  menueSeite(1),
  menueSeite(2),
  menueSeite(3)
]);
</script>
</body>
</html>
