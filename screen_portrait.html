<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KLEEFOOD – Screen 3 – Spar Menüs</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800;900&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
</head>
<body>

<!-- SCREEN 3 (1080x1920, Hochformat) – die vier Spar Menüs
     Liefert der TV ein Querformat-Signal, dreht sich die Bühne automatisch
     um 270°. Taste "R" kehrt die Drehrichtung um und merkt sich das.
     Inhalte und Preise stehen in menu.js, das Design in board.css        -->

<div id="stage" class="hoch">
  <div id="wolken"></div>

  <header>
    <img class="logo" src="logo.jpg" alt="KleeFood">
    <div class="marke">
      <h1>KLEE<em>FOOD</em></h1>
      <p>Burger · Pizza · Fingerfood</p>
    </div>
  </header>

  <div class="hochtitel">
    <div class="ab" id="ab"></div>
    <h2>SPAR MENÜS</h2>
    <p id="info"></p>
  </div>

  <div id="menues"></div>

  <div id="hochfuss">
    <div class="zeile1" id="aktion"></div>
    <div class="tel" id="tel"></div>
  </div>
</div>

<script src="menu.js"></script>
<script src="board.js"></script>
<script>
document.getElementById('ab').textContent   = SPAR.ab.toUpperCase();
document.getElementById('info').textContent = SPAR.info;
document.getElementById('tel').textContent  = TELEFON;
document.getElementById('menues').innerHTML = menueKarten();
document.getElementById('aktion').innerHTML =
  '<b>' + AKTION.titel + '</b>' + AKTION.was.charAt(0) + AKTION.was.slice(1).toLowerCase() +
  ' ' + AKTION.info + '<span>' + AKTION.preis + '</span>';

starten();
</script>
</body>
</html>
