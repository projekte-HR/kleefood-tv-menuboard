<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KLEEFOOD – Screen 3 – Spar Menüs</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800;900&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
/* =======================================================================
   KLEEFOOD – SCREEN 3: SPAR MENÜS (1080x1920, Hochformat)
   Menü-Tafel im Fast-Food-Stil: drei Menüs, jedes mit Bild, Inhalt und Preis.

   Für einen um 90° gedrehten TV:
     Querformat-Signal -> Bühne dreht sich automatisch, Taste "R" kehrt um
     Hochformat-Signal -> nur skalieren

   Fire TV Stick: KEINE Videos, keine Dauer-Animationen, keine Filter.
   Nur drei lokale Bilder (zusammen rund 300 KB).
   ======================================================================= */

:root{
  --bg:#111417;
  --red:#FF3B21;        /* Rot aus dem KleeFood-Logo */
  --gold:#FF9F1C;
  --white:#fff; --muted:rgba(255,255,255,.66); --line:rgba(255,255,255,.10);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}

#stage{
  position:absolute;top:50%;left:50%;
  width:1080px;height:1920px;margin:-960px 0 0 -540px;
  transform-origin:center center;overflow:hidden;
  font-family:'Poppins',system-ui,sans-serif;color:var(--white);
  background:
    radial-gradient(70% 34% at 50% 0%,   rgba(255,59,33,.16), transparent 62%),
    radial-gradient(80% 30% at 50% 100%, rgba(255,159,28,.13), transparent 62%),
    var(--bg);
  display:flex;flex-direction:column;padding:38px 40px 30px;
}

/* ---------- Kopf ---------- */
#top{flex:none;text-align:center;}
#logo{
  width:210px;height:210px;object-fit:cover;margin:0 auto;display:block;
  border-radius:50%;              /* runder Zuschnitt statt Maske – deutlich günstiger */
}
#kicker{
  display:inline-block;margin-top:2px;padding:10px 34px;border-radius:999px;
  font-family:'Montserrat',sans-serif;font-weight:900;font-size:26px;letter-spacing:7px;
  background:var(--red);color:#fff;
}
#title{
  font-family:'Bebas Neue',sans-serif;font-size:132px;line-height:.9;letter-spacing:5px;margin-top:14px;
  color:var(--white);
}
#sub{font-size:30px;font-weight:300;color:var(--muted);margin-top:6px;}

/* ---------- Menü-Karten ---------- */
#menus{flex:1;min-height:0;display:flex;flex-direction:column;gap:22px;margin-top:26px;}

.menu{
  flex:1;min-height:0;display:flex;align-items:stretch;gap:0;overflow:hidden;
  background:linear-gradient(180deg,rgba(23,28,32,.96),rgba(17,20,23,.96));
  border:2px solid var(--line);border-radius:26px;position:relative;
}
.menu.top{border-color:var(--gold);box-shadow:0 0 34px rgba(255,159,28,.20);}

.menu .pic{width:390px;flex:none;position:relative;overflow:hidden;}
.menu .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.menu .pic::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 55%,rgba(17,20,23,.96) 100%);}

.menu .no{
  position:absolute;left:18px;top:16px;z-index:2;
  width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
  font-family:'Bebas Neue',sans-serif;font-size:52px;line-height:1;
  background:var(--red);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.5);
}

.menu .txt{flex:1;min-width:0;padding:26px 30px;display:flex;flex-direction:column;justify-content:center;}
.menu .nm{font-family:'Bebas Neue',sans-serif;font-size:74px;line-height:.94;letter-spacing:2px;}
.menu .ig{font-size:27px;font-weight:300;color:var(--muted);line-height:1.35;margin-top:12px;}

.menu .price{
  margin-top:auto;align-self:flex-start;
  font-family:'Montserrat',sans-serif;font-weight:900;font-size:64px;color:#0b0f11;
  background:var(--gold);padding:10px 34px;border-radius:18px;
}
.menu.top .price{background:linear-gradient(135deg,var(--gold),#ffd166);}

.badge{
  position:absolute;right:20px;top:18px;z-index:2;
  font-family:'Montserrat',sans-serif;font-weight:900;font-size:20px;letter-spacing:2px;
  background:var(--gold);color:#0b0f11;padding:7px 18px;border-radius:999px;
}

/* Einblendung – läuft einmal, nicht dauerhaft */
.play .menu{animation:up .7s cubic-bezier(.22,1,.36,1) calc(var(--i)*.14s) both;}
@keyframes up{from{opacity:0;transform:translateY(46px);} to{opacity:1;transform:none;}}
.play #top{animation:up .7s cubic-bezier(.22,1,.36,1) both;}

/* ---------- Fuß ---------- */
#foot{
  flex:none;margin-top:24px;padding-top:20px;border-top:2px solid var(--line);text-align:center;
}
#foot .a{font-family:'Montserrat',sans-serif;font-weight:900;font-size:30px;color:var(--gold);letter-spacing:2px;}
#foot .b{font-size:24px;font-weight:500;color:var(--muted);margin-top:8px;}
</style>
</head>
<body>

<div id="stage" class="play">

  <div id="top">
    <img id="logo" src="logo.jpg" alt="KleeFood">
    <div id="kicker">MACH DEIN MENÜ DRAUS</div>
    <div id="title">SPAR MENÜS</div>
    <div id="sub">Jedes Menü mit Pommes und 0,33 l Softdrink</div>
  </div>

  <div id="menus"></div>

  <div id="foot">
    <div class="a">TÄGLICH 11:00 – 23:00 UHR</div>
    <div class="b">Kirchröder Str. 77, 30625 Hannover · Tel. 0511 569 575 67</div>
  </div>
</div>

<script>
/* =======================================================================
   INHALTE – die drei Spar Menüs.
   Bilder liegen lokal im Ordner fotos/ (zusammen rund 300 KB).
   ======================================================================= */
const MENUS = [
  { no:"1", nm:"BURGER MENÜ",
    ig:"Burger nach Wahl · Pommes · 0,33 l Softdrink",
    price:"12,90 €", img:"fotos/menu1.jpg", top:true, badge:"BELIEBT" },
  { no:"2", nm:"SMASH MENÜ",
    ig:"2× Smash Burger nach Wahl · Pommes · 0,33 l Softdrink",
    price:"12,90 €", img:"fotos/menu2.jpg" },
  { no:"3", nm:"FALAFEL MENÜ",
    ig:"Falafel Rolle · Pommes · 0,33 l Softdrink",
    price:"12,90 €", img:"fotos/menu3.jpg" }
];

const menus = document.getElementById('menus');
menus.innerHTML = MENUS.map((m,i) =>
  '<div class="menu' + (m.top ? ' top' : '') + '" style="--i:' + i + '">' +
    '<div class="pic"><img src="' + m.img + '" alt=""><div class="no">' + m.no + '</div></div>' +
    (m.badge ? '<div class="badge">' + m.badge + '</div>' : '') +
    '<div class="txt">' +
      '<div class="nm">' + m.nm + '</div>' +
      '<div class="ig">' + m.ig + '</div>' +
      '<div class="price">' + m.price + '</div>' +
    '</div>' +
  '</div>').join('');

/* Einblendung alle 60 s einmal neu, damit die Tafel nicht tot wirkt */
const stage = document.getElementById('stage');
setInterval(() => {
  stage.classList.remove('play');
  void stage.offsetWidth;
  stage.classList.add('play');
}, 60000);

/* ---------- Drehung & Skalierung ----------
   Querformat-Signal -> 90° drehen · Hochformat-Signal -> nur skalieren
   Taste "R" schaltet die Drehrichtung um.                                */
function store(v){ try{ if(v===undefined) return localStorage.getItem('kleefood-rot');
                        localStorage.setItem('kleefood-rot', v); }catch(e){ return null; } }
let dir = +(store() || 90);

function fit(){
  const rot = innerWidth >= innerHeight ? dir : 0;
  const w = rot ? 1920 : 1080, h = rot ? 1080 : 1920;
  const s = Math.min(innerWidth / w, innerHeight / h);
  stage.style.transform = 'rotate(' + rot + 'deg) scale(' + s + ')';
}
addEventListener('resize', fit);
addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'r'){ dir = dir === 90 ? 270 : 90; store(dir); fit(); }
});
fit();
</script>
</body>
</html>
