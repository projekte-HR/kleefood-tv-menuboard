<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KLEEFOOD – Screen 3 – Burger Zubereitung (Hochformat)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@600;800;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* =======================================================================
   KLEEFOOD – SCREEN 3: BURGER-ZUBEREITUNG (HOCHFORMAT 1080x1920)
   Für einen um 90° gedrehten TV.
   - Ist das Browserfenster QUER (normaler TV im Querformat-Signal),
     wird die Bühne automatisch um 90° gedreht.
   - Ist das Signal bereits HOCHKANT, wird nur skaliert.
   - Taste "R" dreht die Richtung um (im-/gegen den Uhrzeigersinn),
     die Einstellung wird im Browser gespeichert.
   Videos & Texte: siehe CLIPS-Array unten im <script>.
   ======================================================================= */

:root{
  --bg:#111417; --green:#00E676; --green-deep:#10B981; --gold:#FF9F1C;
  --white:#fff; --muted:rgba(255,255,255,.72);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}

/* Feste Hochformat-Bühne – wird per JS gedreht und skaliert */
#stage{
  position:absolute;top:50%;left:50%;
  width:1080px;height:1920px;margin:-960px 0 0 -540px;
  transform-origin:center center;
  background:var(--bg);overflow:hidden;
  font-family:'Poppins',system-ui,sans-serif;color:var(--white);
}

/* ---------- 1. Video-Ebene (zwei Player für weiche Überblendung) ---------- */
.player{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .9s ease;
  transform:scale(1.02);
}
.player.on{opacity:1;}

/* Abdunklung für Textlesbarkeit */
#scrim{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(17,20,23,.90) 0%,rgba(17,20,23,.25) 26%,rgba(17,20,23,.10) 52%,rgba(17,20,23,.94) 88%),
    radial-gradient(90% 45% at 50% 100%,rgba(255,159,28,.20),transparent 70%);
}

/* ---------- 2. Feuer-Übergang zwischen den Videos ---------- */
#fire{
  position:absolute;inset:0;z-index:5;width:100%;height:100%;object-fit:cover;
  mix-blend-mode:screen;opacity:0;transition:opacity .35s ease;pointer-events:none;
  transform:scale(1.25);           /* Flammen greifen über den ganzen Screen */
}
#fire.on{opacity:1;}
/* zusätzlicher Hitze-Flash, damit der Schnitt knallt */
#flash{
  position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;
  background:radial-gradient(70% 45% at 50% 88%,rgba(255,159,28,.75),rgba(255,80,0,.35) 45%,transparent 75%);
}
#flash.burn{animation:burn 1.4s ease-out;}
@keyframes burn{
  0%{opacity:0;}
  18%{opacity:1;}
  100%{opacity:0;}
}

/* Glut-Partikel (immer sichtbar, dezent) */
#embers{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;}
.ember{
  position:absolute;bottom:-30px;border-radius:50%;opacity:0;
  filter:blur(.6px);animation:emberRise linear infinite;
}
@keyframes emberRise{
  0%{transform:translate(0,0) scale(.6);opacity:0;}
  10%{opacity:.9;}
  100%{transform:translate(var(--dx,20px),-2000px) scale(1.2);opacity:0;}
}

/* ---------- 3. Kopfbereich ---------- */
#top{position:absolute;top:0;left:0;right:0;z-index:8;padding:70px 70px 0;text-align:center;}
#logo{
  font-family:'Bebas Neue',sans-serif;font-size:104px;letter-spacing:9px;line-height:1;
  background:linear-gradient(92deg,var(--white),var(--green) 55%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:neon 3.4s ease-in-out infinite;
}
@keyframes neon{
  0%,100%{filter:drop-shadow(0 0 22px rgba(0,230,118,.35));}
  50%    {filter:drop-shadow(0 0 52px rgba(0,230,118,.70));}
}
#claim{
  margin-top:12px;font-size:24px;letter-spacing:9px;text-transform:uppercase;color:var(--muted);
}
#live{
  display:inline-flex;align-items:center;gap:14px;margin-top:26px;
  padding:12px 30px;border-radius:999px;
  border:2px solid rgba(255,159,28,.55);background:rgba(255,159,28,.10);
  font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;letter-spacing:4px;text-transform:uppercase;
  animation:livePulse 2.6s ease-in-out infinite;
}
@keyframes livePulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,159,28,.45);}
  50%    {box-shadow:0 0 0 18px rgba(255,159,28,0);}
}
#live .dot{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold);}

/* ---------- 4. Schritt-Text unten ---------- */
#bottom{position:absolute;left:0;right:0;bottom:0;z-index:8;padding:0 70px 78px;}

.reveal{opacity:0;transform:translateY(56px);}
#bottom.play .reveal{animation:up .95s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes up{to{opacity:1;transform:translateY(0);}}

#step{
  display:inline-block;font-family:'Montserrat',sans-serif;font-weight:900;font-size:22px;
  letter-spacing:6px;color:#0b0f11;background:var(--green);padding:10px 26px;border-radius:999px;
  animation-delay:.1s;
}
#head{
  margin-top:22px;font-family:'Bebas Neue',sans-serif;font-size:128px;line-height:.95;letter-spacing:2px;
  background:linear-gradient(92deg,var(--white) 10%,var(--green) 60%,var(--gold) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation-delay:.25s;
}
#sub{
  margin-top:20px;font-size:34px;font-weight:300;line-height:1.45;color:var(--muted);
  animation-delay:.4s;
}

/* Fortschrittspunkte je Video */
#dots{display:flex;gap:14px;margin-top:44px;}
.dot-i{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;}
.dot-i i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold));}
.dot-i.done i{width:100%;}
.dot-i.now i{animation:grow linear forwards;}
@keyframes grow{from{width:0}to{width:100%}}

/* Fußzeile mit Kontakt */
#foot{
  margin-top:38px;display:flex;align-items:center;gap:24px;
  border-top:1.5px solid rgba(255,255,255,.12);padding-top:26px;
  font-family:'Montserrat',sans-serif;
}
#foot .deal{
  padding:14px 28px;border-radius:16px;color:#0b0f11;font-weight:900;font-size:30px;
  background:linear-gradient(135deg,var(--green),var(--gold));white-space:nowrap;
}
#foot .txt{font-size:21px;font-weight:600;line-height:1.35;color:var(--muted);}
#foot .txt b{color:var(--white);}
</style>
</head>
<body>

<div id="stage">
  <!-- Videoebene -->
  <video class="player" id="pA" muted playsinline preload="auto"></video>
  <video class="player" id="pB" muted playsinline preload="auto"></video>

  <!-- Feuer-Übergang -->
  <video id="fire" muted playsinline preload="auto" loop></video>
  <div id="flash"></div>

  <div id="embers"></div>
  <div id="scrim"></div>

  <!-- Kopf -->
  <div id="top">
    <div id="logo">KLEEFOOD</div>
    <div id="claim">Burger • Pizza • Fingerfood</div>
    <div id="live"><span class="dot"></span> Frisch gegrillt vor deinen Augen</div>
  </div>

  <!-- Schritt-Text -->
  <div id="bottom">
    <span id="step" class="reveal"></span>
    <h1 id="head" class="reveal"></h1>
    <p  id="sub"  class="reveal"></p>
    <div id="dots"></div>
    <div id="foot">
      <div class="deal">SPAR MENÜ 12,90 €</div>
      <div class="txt"><b>Täglich 11:00 – 23:00 Uhr</b><br>Kirchröder Str. 77, Hannover · Tel. 0511 569 575 67</div>
    </div>
  </div>
</div>

<script>
/* =======================================================================
   INHALTE – Videos und Texte der Zubereitungs-Schritte.
   src : Video-URL (hier Mixkit-Free-Clips; einfach gegen eigene
         Aufnahmen aus der Küche tauschen, z. B. "videos/patty.mp4")
   secs: Anzeigedauer in Sekunden (Clip läuft in Schleife, falls kürzer)
   ======================================================================= */
const CLIPS = [
  { step:"Schritt 01", head:"Frisches<br>Angus-Rind",   sub:"Grob gewolft, nur mit Salz & Pfeffer gewürzt – niemals vorgeformt.",
    src:"https://assets.mixkit.co/videos/16599/16599-720.mp4", secs:9 },
  { step:"Schritt 02", head:"Auf die<br>offene Flamme",  sub:"Heißer Grill, kräftige Röstaromen – so entsteht die Kruste.",
    src:"https://assets.mixkit.co/videos/12041/12041-720.mp4", secs:9 },
  { step:"Schritt 03", head:"Cheddar<br>schmelzen",      sub:"Gereifter Cheddar direkt auf dem heißen Patty verlaufen lassen.",
    src:"https://assets.mixkit.co/videos/12016/12016-720.mp4", secs:9 },
  { step:"Schritt 04", head:"Klee<br>Signature-Sauce",   sub:"Hausgemacht – jeden Morgen frisch angerührt.",
    src:"https://assets.mixkit.co/videos/24785/24785-720.mp4", secs:9 },
  { step:"Schritt 05", head:"Frisch<br>gestapelt",       sub:"Salat, Tomate, Zwiebeln & Gurken – alles täglich frisch geschnitten.",
    src:"https://assets.mixkit.co/videos/3533/3533-1080.mp4",  secs:9 },
  { step:"Schritt 06", head:"Pommes<br>dazu – fertig",   sub:"Als Spar Menü mit Pommes und 0,33 l Softdrink für 12,90 €.",
    src:"https://assets.mixkit.co/videos/36582/36582-720.mp4", secs:9 }
];

/* Feuer-Clip für den Übergang (Flammen auf Schwarz, wird per "screen" überblendet) */
const FIRE_SRC   = "https://assets.mixkit.co/videos/52292/52292-1080.mp4";
const FIRE_START = 13.5;   // Feuer-Clip nur im heißen Abschnitt laufen lassen …
const FIRE_END   = 18.8;   // … und dort in Schleife halten (Clip ist 19,5 s lang)
const FIRE_MS    = 1400;   // Dauer des Feuer-Übergangs
const FADE_MS    = 900;    // Kreuzblende zwischen den Videos (= CSS .player transition)

/* ---------- Aufbau ---------- */
const pA = document.getElementById('pA'), pB = document.getElementById('pB');
const fire = document.getElementById('fire'), flash = document.getElementById('flash');
const bottom = document.getElementById('bottom'), dots = document.getElementById('dots');

fire.src = FIRE_SRC;

CLIPS.forEach(() => {
  const d = document.createElement('div');
  d.className = 'dot-i';
  d.innerHTML = '<i></i>';
  dots.appendChild(d);
});
const dotEls = [...dots.children];

let front = pA, back = pB, idx = -1, timer = null;

function play(i){
  idx = (i + CLIPS.length) % CLIPS.length;
  const c = CLIPS[idx];

  // Feuer-Übergang zünden
  burnTransition();

  // Nächstes Video im Hintergrund-Player laden und einblenden
  back.src = c.src;
  back.loop = true;
  back.play().catch(() => {});          // Autoplay ist durch "muted" erlaubt
  setTimeout(() => {
    back.classList.add('on');
    front.classList.remove('on');
    const tmp = front; front = back; back = tmp;
  }, FIRE_MS * 0.45);                    // Schnitt liegt im hellsten Moment des Feuers

  // Texte neu einblenden
  setTimeout(() => {
    bottom.classList.remove('play');
    void bottom.offsetWidth;             // Reflow -> Animationen starten neu
    document.getElementById('step').textContent = c.step;
    document.getElementById('head').innerHTML   = c.head;
    document.getElementById('sub').textContent  = c.sub;
    bottom.classList.add('play');
  }, FIRE_MS * 0.5);

  // Fortschrittsbalken
  dotEls.forEach((d,n) => {
    d.className = 'dot-i' + (n < idx ? ' done' : n === idx ? ' now' : '');
    d.firstChild.style.animationDuration = c.secs + 's';
  });

  clearTimeout(timer);
  timer = setTimeout(() => play(idx + 1), c.secs * 1000);
}

// Der Feuer-Clip läuft dauerhaft in Schleife im Hintergrund und wird nur
// ein- und ausgeblendet – so gibt es beim Übergang keine Ruckler durchs Suchen.
fire.loop = false;
fire.addEventListener('loadeddata', () => { fire.currentTime = FIRE_START; fire.play().catch(() => {}); });
fire.addEventListener('timeupdate', () => {
  if (fire.currentTime >= FIRE_END || fire.currentTime < FIRE_START - .5) fire.currentTime = FIRE_START;
});

function burnTransition(){
  fire.classList.add('on');
  flash.classList.remove('burn'); void flash.offsetWidth; flash.classList.add('burn');
  setTimeout(() => fire.classList.remove('on'), FIRE_MS);
}

/* ---------- Glut-Partikel ---------- */
const emb = document.getElementById('embers');
for (let i = 0; i < 34; i++){
  const e = document.createElement('div');
  const s = 2 + Math.random() * 6;
  e.className = 'ember';
  e.style.cssText =
    'left:' + (Math.random()*100) + '%;width:' + s + 'px;height:' + s + 'px;' +
    '--dx:' + (Math.random()*120 - 60) + 'px;' +
    'background:' + (Math.random() > .5 ? 'var(--gold)' : '#ff5b1f') + ';' +
    'animation-duration:' + (9 + Math.random()*10) + 's;' +
    'animation-delay:' + (-Math.random()*18) + 's;';
  emb.appendChild(e);
}

/* ---------- Drehung & Skalierung ---------------------------------------
   Querformat-Signal  -> Bühne um 90° drehen (TV hängt hochkant)
   Hochformat-Signal  -> nur skalieren
   Taste "R"          -> Drehrichtung umschalten (90° / 270°)
   ----------------------------------------------------------------------- */
// Drehrichtung merken – localStorage kann je nach Browser/Kiosk gesperrt sein
function store(v){ try{ if(v===undefined) return localStorage.getItem('kleefood-rot');
                        localStorage.setItem('kleefood-rot', v); }catch(e){ return null; } }
let dir = +(store() || 90);   // 90 = im Uhrzeigersinn

function fit(){
  const vw = innerWidth, vh = innerHeight;
  const landscape = vw >= vh;
  const rot = landscape ? dir : 0;
  // Nach der Drehung tauschen Breite und Höhe der Bühne die Rollen
  const w = rot ? 1920 : 1080, h = rot ? 1080 : 1920;
  const s = Math.min(vw / w, vh / h);
  document.getElementById('stage').style.transform = 'rotate(' + rot + 'deg) scale(' + s + ')';
}
addEventListener('resize', fit);
addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'r'){
    dir = dir === 90 ? 270 : 90;
    store(dir);
    fit();
  }
});
fit();

play(0);
</script>
</body>
</html>
