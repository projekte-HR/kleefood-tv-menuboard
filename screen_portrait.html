<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KLEEFOOD – Screen 3 – Gerichte (Hochformat)</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800;900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
<style>
/* =======================================================================
   KLEEFOOD – SCREEN 3: GERICHTE IM HOCHFORMAT (1080x1920)
   Für einen um 90° gedrehten TV, optimiert für den Fire TV Stick.

   QUALITÄT: Die Clips sind im Querformat (1280x720). Früher wurden sie auf
   die volle Hochkant-Fläche gezoomt – dabei blieb nur der mittlere Streifen
   übrig, 2,7-fach vergrößert = unscharf. Jetzt läuft das Video in einem
   16:9-Fenster in Originalproportion (1020x574): das 720p-Bild wird leicht
   VERKLEINERT statt vergrößert und ist dadurch gestochen scharf.
   ======================================================================= */

:root{
  --bg:#111417;
  --red:#FF3B21;        /* Rot aus dem KleeFood-Logo */
  --gold:#FF9F1C;
  --white:#fff; --muted:rgba(255,255,255,.72);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}

#stage{
  position:absolute;top:50%;left:50%;
  width:1080px;height:1920px;margin:-960px 0 0 -540px;
  transform-origin:center center;overflow:hidden;
  font-family:'Poppins',system-ui,sans-serif;color:var(--white);
  background:
    radial-gradient(70% 40% at 50% 0%,   rgba(255,59,33,.16), transparent 60%),
    radial-gradient(80% 40% at 50% 100%, rgba(255,159,28,.12), transparent 60%),
    var(--bg);
}

/* ---------- 1. Kopf mit Logo ---------- */
#top{position:absolute;top:0;left:0;right:0;height:400px;z-index:8;padding-top:34px;text-align:center;}
#logo{
  width:300px;height:300px;object-fit:cover;margin:0 auto;display:block;
  /* runde Maske: der dunkle Bildrand des Logos verschwindet weich im Hintergrund */
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 63%, transparent 73%);
          mask-image:radial-gradient(circle at 50% 50%, #000 63%, transparent 73%);
}
#claim{margin-top:-6px;font-size:24px;letter-spacing:9px;text-transform:uppercase;color:var(--muted);}

/* ---------- 2. Video-Fenster (16:9, Originalproportion) ---------- */
#band{
  position:absolute;top:406px;left:30px;width:1020px;height:574px;z-index:2;
  border-radius:26px;overflow:hidden;background:#000;
  border:2px solid rgba(255,59,33,.35);
  box-shadow:0 24px 70px rgba(0,0,0,.55);
}
.player{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .35s linear;
}
.player.on{opacity:1;z-index:2;}

/* ---------- 3. Gericht-Text ---------- */
#bottom{position:absolute;left:0;right:0;top:1020px;bottom:0;z-index:8;padding:0 60px;}

.reveal{opacity:0;transform:translateY(40px);}
#bottom.play .reveal{animation:up .7s ease-out forwards;}
@keyframes up{to{opacity:1;transform:translateY(0);}}

#cat{
  display:inline-block;font-family:'Montserrat',sans-serif;font-weight:900;font-size:24px;
  letter-spacing:5px;color:#fff;background:var(--red);padding:11px 28px;border-radius:999px;
  animation-delay:.05s;
}
#head{
  margin-top:24px;font-family:'Bebas Neue',sans-serif;font-size:130px;line-height:.93;letter-spacing:2px;
  color:var(--white);animation-delay:.15s;
}
#sub{margin-top:20px;font-size:35px;font-weight:300;line-height:1.4;color:var(--muted);animation-delay:.25s;}
#price{
  display:inline-block;margin-top:34px;font-family:'Montserrat',sans-serif;font-weight:900;font-size:88px;
  color:#0b0f11;background:var(--gold);padding:16px 50px;border-radius:24px;animation-delay:.35s;
}

/* Fortschrittsbalken je Gericht */
#dots{position:absolute;left:60px;right:60px;bottom:196px;display:flex;gap:12px;}
.dot-i{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;}
.dot-i i{display:block;height:100%;width:0;background:var(--red);}
.dot-i.done i{width:100%;}
.dot-i.now i{animation:grow linear forwards;}
@keyframes grow{from{width:0}to{width:100%}}

#foot{
  position:absolute;left:60px;right:60px;bottom:90px;padding-top:26px;
  border-top:1.5px solid rgba(255,255,255,.12);
  font-family:'Montserrat',sans-serif;font-size:23px;font-weight:800;color:var(--muted);letter-spacing:1px;
}
#foot b{color:var(--white);}

/* ---------- 4. Übergangs-Video ---------- */
#trans{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  z-index:9;opacity:0;transition:opacity .25s linear;pointer-events:none;
  /* "screen" blendet das Schwarz des Clips weg: nur die Flammen bleiben,
     das Gericht dahinter verschwindet nie in einem schwarzen Bild. */
  mix-blend-mode:screen;
}
#trans.on{opacity:1;}
</style>
</head>
<body>

<div id="stage">

  <div id="top">
    <img id="logo" src="logo.jpg" alt="KleeFood">
    <div id="claim">Burger • Pizza • Fingerfood</div>
  </div>

  <!-- Video im 16:9-Fenster: keine Vergrößerung, dadurch scharf -->
  <div id="band">
    <video id="pA" class="player" muted playsinline preload="auto" loop></video>
    <video id="pB" class="player" muted playsinline preload="auto" loop></video>
  </div>

  <div id="bottom">
    <span id="cat"  class="reveal"></span>
    <h1   id="head" class="reveal"></h1>
    <p    id="sub"  class="reveal"></p>
    <div><span id="price" class="reveal"></span></div>
  </div>

  <div id="dots"></div>
  <div id="foot"><b>TÄGLICH 11:00 – 23:00 UHR</b> · Kirchröder Str. 77, Hannover · Tel. 0511 569 575 67</div>

  <!-- Übergangs-Video liegt über allem, sein Schwarz wird weggeblendet -->
  <video id="trans" muted playsinline preload="auto"></video>
</div>

<script>
/* =======================================================================
   INHALTE – Gerichte direkt aus der KLEEFOOD-Speisekarte.
   vid  : Mixkit-Video-ID (eigene Aufnahme? stattdessen full:"videos/x.mp4")
   secs : Anzeigedauer in Sekunden
   ======================================================================= */

/* Videoqualität: 720 = scharf (die Clips gibt es nicht höher aufgelöst)
   360 = Notfallstufe, falls das WLAN am Stick zu langsam ist            */
const RES = 720;

const DISHES = [
  { cat:"Nr. 04 · Burger", head:"Kleefood<br>BBQ Burger",  sub:"Rindfleisch-Patty, Cheddar-Käse, Bacon, Barbecue-Sauce",
    price:"7,50 €",  vid:12041, secs:10 },
  { cat:"Nr. 13 · Burger", head:"Kleefeld<br>Special",     sub:"2 Mozzarella-Sticks, 2 Zwiebelringe, Röstzwiebeln, Sauce nach Wahl",
    price:"10,00 €", vid:12016, secs:10 },
  { cat:"Nr. 03 · Burger", head:"Chili<br>Cheeseburger",   sub:"Rindfleisch-Patty, Cheddar-Käse, Jalapeños, Chili-Sauce",
    price:"7,00 €",  vid:16599, secs:10 },
  { cat:"Nr. 17 · Smash",  head:"Chili Cheese<br>Smash",   sub:"Smash-Patty mit Käse und Jalapeños · doppeltes Patty +2,50 €",
    price:"5,00 €",  vid:11760, secs:10 },
  { cat:"Nr. 26 · Beilage",head:"Chili<br>Cheese Fries",   sub:"Knusprige Fries mit Jalapeños und Käse",
    price:"5,50 €",  vid:36582, secs:10 },
  { cat:"Spar Menü",       head:"Menü statt<br>nur Burger",sub:"Burger nach Wahl + Pommes + 0,33 l Softdrink",
    price:"12,90 €", vid:14010, secs:10 }
];

/* Übergangs-Video zwischen den Gerichten (Auswahl: uebergaenge.html)
     52312 / 1.2  Feuer nah        (aktuell)
     52284 / 1.0  Flammen hoch
     52289 / 1.5  Flammen Zeitlupe
      2780 / 1.0  BBQ-Grill-Flammen
     50951 / 0.6  Rauch-Wirbel                                            */
const TRANS = { vid:52312, start:1.2, ms:1600, res:720 };

const url = (d) => d.full || ('https://assets.mixkit.co/videos/' + d.vid + '/' + d.vid + '-' + RES + '.mp4');

/* ---------- Aufbau ---------- */
let front = document.getElementById('pA');   // läuft gerade
let back  = document.getElementById('pB');   // lädt schon das nächste Gericht
const trans  = document.getElementById('trans');
const bottom = document.getElementById('bottom');
const dots   = document.getElementById('dots');

trans.src = 'https://assets.mixkit.co/videos/' + TRANS.vid + '/' + TRANS.vid + '-' + TRANS.res + '.mp4';
trans.addEventListener('loadeddata', () => { trans.currentTime = TRANS.start; });

DISHES.forEach(() => {
  const d = document.createElement('div');
  d.className = 'dot-i'; d.innerHTML = '<i></i>';
  dots.appendChild(d);
});
const dotEls = [...dots.children];

let idx = -1, timer = null;

function preload(i){                        // nächsten Clip schon puffern
  const d = DISHES[(i + DISHES.length) % DISHES.length];
  if (back.src !== url(d)){ back.src = url(d); back.load(); }
}

function show(i){
  idx = (i + DISHES.length) % DISHES.length;
  const d = DISHES[idx];

  playTransition();                         // Feuer läuft – der Wechsel passiert dahinter

  setTimeout(() => {
    if (back.src !== url(d)) back.src = url(d);
    back.play().catch(() => {});
    back.classList.add('on');               // einblenden …
    front.classList.remove('on');           // … und den alten Clip ausblenden
    const tmp = front; front = back; back = tmp;
    setTimeout(() => { back.pause(); preload(idx + 1); }, 400);

    bottom.classList.remove('play');
    void bottom.offsetWidth;                // Reflow -> Animationen starten neu
    document.getElementById('cat').innerHTML     = d.cat;
    document.getElementById('head').innerHTML    = d.head;
    document.getElementById('sub').textContent   = d.sub;
    document.getElementById('price').textContent = d.price;
    bottom.classList.add('play');
  }, TRANS.ms * 0.45);                      // Wechsel im dichtesten Moment des Feuers

  dotEls.forEach((el,n) => {
    el.className = 'dot-i' + (n < idx ? ' done' : n === idx ? ' now' : '');
    el.firstChild.style.animationDuration = d.secs + 's';
  });

  clearTimeout(timer);
  timer = setTimeout(() => show(idx + 1), d.secs * 1000);
}

/* Übergangs-Video nur während des Wechsels abspielen – dazwischen steht es
   still, das spart auf dem Fire TV Stick spürbar Leistung. */
function playTransition(){
  trans.currentTime = TRANS.start;
  trans.play().catch(() => {});
  trans.classList.add('on');
  setTimeout(() => trans.classList.remove('on'), TRANS.ms);
  setTimeout(() => trans.pause(), TRANS.ms + 300);
}

/* ---------- Drehung & Skalierung ----------
   Querformat-Signal -> 90° drehen · Hochformat-Signal -> nur skalieren
   Taste "R" schaltet die Drehrichtung um.                                */
function store(v){ try{ if(v===undefined) return localStorage.getItem('kleefood-rot');
                        localStorage.setItem('kleefood-rot', v); }catch(e){ return null; } }
let dir = +(store() || 90);

function fit(){
  const rot = innerWidth >= innerHeight ? dir : 0;
  const w = rot ? 1920 : 1080, h = rot ? 1080 : 1920;
  const s = Math.min(innerWidth / w, innerHeight / h);
  document.getElementById('stage').style.transform = 'rotate(' + rot + 'deg) scale(' + s + ')';
}
addEventListener('resize', fit);
addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'r'){ dir = dir === 90 ? 270 : 90; store(dir); fit(); }
});
fit();

show(0);
</script>
</body>
</html>
